function progressText(){
  var d=new Date();
  var zDone=ZI.filter(function(z){ return S.prog.known[z[0]]; }).length;
  var passedC=LEVELS.filter(function(L,i){ return S.prog.passed[i]; }).length;
  var miss=ziMiss();
  var errs=Object.keys(S.prog.err||{}).sort(function(a,b){ return (S.prog.err[b]||0)-(S.prog.err[a]||0); }).slice(0,20);
  var out=['黑洞入侵 · 拼音大作战　学习进度',
    '日期：'+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2),'',
    '⭐ 星星：'+S.prog.stars+'　　通关：'+passedC+'/'+LEVELS.length+' 关　　已认汉字：'+zDone+'/'+ZI.length,
    '难度：'+(diffOn().emo+' '+diffOn().name),'','【各关认字情况】'];
  LEVELS.forEach(function(lv,i){
    if(lv.type!=='zi'){ out.push((i+1)+'. '+lv.name+'　'+(S.prog.passed[i]?'已通关':'-')); return; }
    var q=levelDone(lv);
    out.push((i+1)+'. '+lv.name+'　'+q.done+'/'+q.total+' '+diffStar(lv.diff)+(q.done>=q.total?'　✅':''));
  });
  out.push('','【还没认会的字 '+miss.length+' 个】', miss.length?miss.join(' '):'（已全部认会）');
  if(errs.length) out.push('','【点错最多的音】', errs.map(function(k){ return k+'('+S.prog.err[k]+')'; }).join(' '));
  return out.join('\n');
}
function copyProgress(){
  var t=progressText(), done=function(){ toast('进度已复制，粘贴留存或发家长', 2.6); };
  function fb(){
    try{
      var ta=document.createElement('textarea');
      ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); done();
    }catch(e){ toast('复制失败，请改用「导出 txt」', 2.6); }
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done, fb);

/* ---------- 12b. 进度备份 / 还原（v12）----------
   背景：进度只存 localStorage，换手机 / 清缓存 / 重装微信就全丢；
   旧的「导出 txt」是给人读的**报告**，没法回填（全文件原本没有任何导入函数）。
   这里补上真正可还原的存档：
     导出 = 一段带校验位的 JSON（微信内长按复制，浏览器里下载 .json）；
     导入 = 粘贴 / 选文件 → 校验 → 预览「将恢复 X 关 / Y 字」→ 确认后覆盖回填。 */
var BK_VER = 1;
function bkSig(o){ return hzHash(JSON.stringify(o)); }   // 校验位：防粘贴截断 / 手改
function bkBuild(){
  return {app:'bhpy', v:BK_VER, ts:Date.now(), prog:S.prog, custom:(CUSTOM||[])};
}
function bkText(){
  var o=bkBuild();
  o.sig=bkSig({prog:o.prog, custom:o.custom});
  return JSON.stringify(o);
}
function bkName(){
  var d=new Date(), q=function(n){ return ('0'+n).slice(-2); };
  return '拼音进度备份-'+d.getFullYear()+q(d.getMonth()+1)+q(d.getDate())+'-'+q(d.getHours())+q(d.getMinutes())+'.json';
}
function bkDownload(){
  var t=bkText();
  if(IS_WX){ bkShowText(t); return; }        // 微信不支持文件下载 → 改走长按复制
  try{
    var blob=new Blob([t], {type:'application/json;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=bkName();
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(a.href); document.body.removeChild(a); }catch(e){} }, 1500);
    toast('备份已下载（.json），换设备时导入即可还原', 2.8);
  }catch(e){ bkShowText(t); }
}

/* 解析 + 校验（返回 {ok:obj} 或 {err:'原因'}） */
function bkParse(t){
  t=String(t||'').trim();
  if(!t) return {err:'请先粘贴备份内容'};
  var o;
  try{ o=JSON.parse(t); }catch(e){ return {err:'这段内容不是有效的备份（解析失败），请确认完整复制了'} };
  if(!o || o.app!=='bhpy') return {err:'这不是本游戏的进度备份（缺少 bhpy 标记）'};
  if(!o.prog || typeof o.prog!=='object') return {err:'备份里没有进度数据'};
  var want=bkSig({prog:o.prog, custom:o.custom||[]});
  if(typeof o.sig==='number' && o.sig!==want)
    return {err:'备份不完整或被改动过（校验不通过），请重新完整复制一遍'};
  return {ok:o};
}

/* 家长进度长图（v8 新增）：用 Canvas 画一张竖版报告图，转成 <img> 插进家长面板。
   微信里长按 <img> 可以直接「保存到相册 / 发送给朋友」，比复制文本更适合发班级群。
   数据全用已有进度（星星 / 通关 / 认字 / 各难度 / 薄弱字），纯前端、零后端。 */
function wrapTextC(g,text,x,y,maxW,lh){
  var chars=text.split(''),line='',yy=y;
  for(var i=0;i<chars.length;i++){
    var t=line+chars[i];
    if(g.measureText(t).width>maxW && line){ g.fillText(line,x,yy); line=chars[i]; yy+=lh; }
    else line=t;
  }
  if(line) g.fillText(line,x,yy);
  return yy-y+lh;
}

/* 点错过的音 · 专项练习（2026-10-10）
   prog.err 的 key 是声母 / 韵母 / 声调 —— bumpErr 只在拼读关的两个错答分支里被调用
   （识字关、自由认读关点中就算对，不记错），所以 err 里永远是拼音片段，不会是汉字。
   因此这里不自己拼 sm+ym 造题（容易拼出无效音节、找不到音频），
   而是从现成拼读关配好的题目里挑「命中点错音」的题来练：题目自带 sm+ym+t+zi+em，零构造风险。 */
function startReviewErr(){
  var err=S.prog.err||{}, keys=Object.keys(err);
  if(!keys.length){ toast('还没有点错记录 —— 先玩几关拼读再来复习吧～', 3); return; }
  var pool=[];
  LEVELS.forEach(function(L){
    if(L.type!=='spell'||!L.tasks) return;
    L.tasks.forEach(function(t){
      var w=(err[t.sm]||0)+(err[t.ym]||0)+(err['tone'+t.t]||0);
      if(w>0) pool.push({t:t, w:w});
    });
  });
  if(!pool.length){ toast('点错的音还没出现在拼读关里，先玩几关拼读吧～', 3); return; }
  pool.sort(function(a,b){ return b.w-a.w; });          // 错得越多的音排越前
  var seen={}, tasks=[];
  pool.forEach(function(p){
    var k=p.t.sm+'|'+p.t.ym+'|'+p.t.t;                  // 按音节去重（同一题可能在多个拼读关出现）
    if(seen[k]) return; seen[k]=1;
    if(tasks.length<8) tasks.push(p.t);
  });
  var hasTone=keys.some(function(k){ return /^tone/.test(k); });   // 错过声调才考声调
  Sfx.ac(); Sound.unlock();
  startLevel(S.li, {name:'复习 · 点错过的音（'+tasks.length+' 题）', type:'spell', tone:!!hasTone,
    tasks:tasks, diff:1, tmp:true,
    tip:'这些都是你以前点错的音，听清楚再喂黑洞 —— 慢一点也没关系！'});
}

/* ---------- 11. 防缩放 / 防跑偏 ----------
   Android 微信内核会忽略 viewport 的 user-scalable=no，
   双指一缩或误触缩放，画面右半边就会被挤到屏幕外（表现为“显示不全”）。
   这里用 JS 把缩放强行钉死在 1。 */
(function(){
  var vv=window.visualViewport;
  function pin(){ try{ if(vv && vv.scale!==1) vv.scale=1; }catch(e){} }
  if(vv){ try{ vv.addEventListener('resize', pin); vv.addEventListener('scroll', pin); }catch(e){} }
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('touchmove', function(e){
    try{ if(e.touches && e.touches.length>1) e.preventDefault(); }catch(err){}
  }, {passive:false});
  document.addEventListener('touchstart', function(e){
    try{ if(e.touches && e.touches.length>1) e.preventDefault(); }catch(err){}
  }, {passive:false});
  // 兜底：任何情况下 body 都不允许横向溢出
  function killHScroll(){
    try{ document.body.scrollLeft=0; document.documentElement.scrollLeft=0; }catch(e){}
  }
  window.addEventListener('scroll', killHScroll);
  setTimeout(killHScroll, 300); setTimeout(killHScroll, 900);
})();
</script>
