<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>黑洞入侵 · 拼音大作战</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拼音大作战">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060f;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#eaf0ff;user-select:none;
    touch-action:none;overscroll-behavior:none}
  html{height:100dvh}
  body{height:100dvh}
  /* 关键：canvas 是替换元素，只给 left/right 不会拉伸，显示宽度会变成
     canvas.width 属性值（=CSS宽×DPR）。DPR=2 的平板/手机上会宽出一倍，
     右半屏被裁掉且“点不到”。必须显式给 100% 宽高。 */
  #stage{position:fixed;top:0;left:0;width:100%;height:100%;display:block;
    touch-action:none;background:#05060f}
  .ui{position:absolute}

  /* 顶栏 */
  #topbar{top:0;left:0;right:0;height:calc(64px + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(8,10,26,.92),rgba(8,10,26,0));z-index:5}
  #lvBox{min-width:0;flex-shrink:1}
  .btn{background:rgba(120,150,255,.16);border:1px solid rgba(150,180,255,.28);color:#dfe7ff;
    border-radius:12px;padding:8px 12px;font-size:15px;cursor:pointer;line-height:1}
  .btn:active{transform:scale(.96)}
  .btn.on{background:rgba(120,255,200,.2);border-color:rgba(120,255,200,.5)}
  #lvName{font-size:17px;font-weight:700;margin-left:2px;text-shadow:0 2px 8px #000;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lvSub{font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  #stars{font-size:17px;font-weight:700;color:#ffd166;white-space:nowrap}

  /* 目标卡 */
  #goal{bottom:0;left:0;right:0;min-height:104px;display:flex;align-items:center;justify-content:center;
    gap:14px;flex-wrap:wrap;padding:10px 12px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(8,10,26,.94),rgba(8,10,26,0));z-index:5}
  .slot{min-width:58px;height:58px;border-radius:16px;background:rgba(120,150,255,.12);
    border:2px dashed rgba(150,180,255,.35);display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:27px;font-weight:800;line-height:1}
  .slot small{font-size:11px;font-weight:600;opacity:.6;margin-top:2px}
  .slot.fill{background:rgba(120,255,200,.16);border:2px solid rgba(120,255,200,.6);color:#c9ffe9}
  .slot.wait{animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #goalText{font-size:15px;max-width:44vw;line-height:1.5}
  #goalLeft{display:flex;align-items:center;gap:7px}
  #goalText b{color:#ffd166;font-size:22px}
  .arrow{font-size:22px;opacity:.45}

  /* 遮罩 */
  .mask{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(4,6,18,.86);backdrop-filter:blur(6px);overflow:auto;padding:12px 0;touch-action:pan-y}
  .card{background:linear-gradient(160deg,#141a3a,#0c1028);border:1px solid rgba(140,170,255,.28);
    border-radius:24px;padding:26px 28px;max-width:560px;width:92%;text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.6);
    max-height:100%;max-height:calc(100dvh - 24px);overflow:auto;-webkit-overflow-scrolling:touch}
  .card h1{margin:0 0 6px;font-size:28px;letter-spacing:1px}
  .card h2{margin:0 0 10px;font-size:24px;color:#ffd166}
  .card p{margin:8px 0;font-size:15px;line-height:1.7;opacity:.86}
  .big{font-size:46px;margin:6px 0}
  .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .lvbtn{width:100%;text-align:left;display:flex;align-items:center;gap:10px;
    background:rgba(120,150,255,.12);border:1px solid rgba(150,180,255,.24);border-radius:14px;
    padding:10px 14px;cursor:pointer;color:#eaf0ff;font-size:15px}
  .lvbtn .no{width:26px;height:26px;border-radius:9px;background:rgba(255,209,102,.22);
    color:#ffd166;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
  .lvbtn.locked{opacity:.42}
  .lvbtn .tag{margin-left:auto;font-size:12px;opacity:.7}
  .hide{display:none!important}
  .close{position:absolute;top:12px;right:14px;font-size:22px;opacity:.6;cursor:pointer}
  #panelScroll{max-height:60vh;overflow:auto;margin-top:8px;display:grid;gap:8px}
  .kv{display:flex;justify-content:space-between;font-size:13px;opacity:.8;padding:3px 0;
    border-bottom:1px dashed rgba(150,180,255,.16)}
  .sw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:14px}
  .tip{font-size:13px;opacity:.7;line-height:1.6;text-align:left;background:rgba(120,150,255,.08);
    border-radius:12px;padding:10px 12px;margin-top:10px}
  /* ---- 关卡地图（v8 新增）---- */
  .lvmap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  .lvsec{font-size:14px;font-weight:700;color:#ffd166;margin:14px 2px 2px;opacity:.95}
  .lvtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(120,150,255,.1);
    border:1px solid rgba(150,180,255,.2);border-radius:14px;padding:10px 12px}
  .lvtop-stats{flex:1 1 auto;font-size:13px;opacity:.9;line-height:1.7}
  .lvtop .btn{padding:7px 11px;font-size:13px;margin:2px 0}
  .lvnode{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;
    background:rgba(120,150,255,.12);border:1px solid rgba(150,180,255,.24);border-radius:13px;
    padding:9px 11px;cursor:pointer;color:#eaf0ff;font-size:13px;min-height:62px;
    animation:lvpop .26s ease both}
  .lvnode .lvno{position:absolute;top:7px;right:9px;font-size:16px;font-weight:800;color:#ffd166}
  .lvnode .lvname{font-size:13px;font-weight:600;padding-right:22px;line-height:1.35}
  .lvnode .lvstar{font-size:11px;opacity:.7;margin-top:1px}
  .lvnode .lvtag{font-size:11px;opacity:.62;margin-top:auto}
  .lvnode.locked{opacity:.4;cursor:default}
  .lvnode.done{background:rgba(120,255,200,.14);border-color:rgba(120,255,200,.4)}
  .lvnode.done::after{content:'★';position:absolute;left:9px;bottom:7px;font-size:11px;color:#7dffc4;opacity:.85}
  /* 刚解锁的下一关：脉冲高亮 + 解锁徽标 */
  .lvnode.justunlocked{animation:lvunlock 1.1s ease both;border-color:#ffd166;
    box-shadow:0 0 0 2px rgba(255,209,102,.6),0 0 22px rgba(255,209,102,.45)}
  .lvnode.justunlocked::before{content:'🎉 解锁';position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    background:#ffd166;color:#3a2a00;font-size:10px;font-weight:800;padding:1px 7px;border-radius:8px;white-space:nowrap;
    animation:lvbadge .4s ease both}
  @keyframes lvunlock{0%{transform:scale(.8);opacity:.3}
    40%{transform:scale(1.08);opacity:1}70%{transform:scale(.97)}100%{transform:scale(1)}}
  @keyframes lvbadge{from{transform:translateX(-50%) translateY(6px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
  @media (min-width:780px){ .lvmap{grid-template-columns:repeat(3,1fr)} }

  /* 手机 / 窄屏适配 */
  @media (max-width:520px){
    #topbar{gap:6px;padding-left:8px;padding-right:8px}
    .btn{padding:7px 9px;font-size:13px;border-radius:10px}
    #lvName{font-size:14px}
    #lvSub{font-size:10px}
    #stars{font-size:14px}
    #goal{gap:7px;padding-left:6px;padding-right:6px}
    .slot{min-width:46px;height:46px;border-radius:12px;font-size:22px}
    .slot small{font-size:9px}
    #goalText{max-width:none;font-size:13px}
    #goalText b{font-size:17px}
    .arrow{font-size:15px}
    .card{padding:18px 14px}
    .card h1{font-size:21px}
    .card p{font-size:13px}
    .big{font-size:34px}
    #panelScroll{max-height:56vh}
  }
  @media (max-width:360px){
    #lvSub{display:none}
    .slot{min-width:40px;height:40px;font-size:19px}
  }

  /* 矮屏适配：手机浏览器/微信工具栏会吃掉 150~250px 高度 */
  @media (max-height:760px){
    #topbar{height:calc(58px + env(safe-area-inset-top));gap:5px}
    #lvName{font-size:13px}
    #lvSub{display:none}
    .btn{padding:6px 9px;font-size:12px;border-radius:9px}
    #stars{font-size:13px}
    #goal{min-height:84px;padding-top:6px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
    .slot{min-width:42px;height:42px;border-radius:11px;font-size:19px;border-width:1.5px}
    .slot small{font-size:9px}
    #goalText{font-size:12px;max-width:40vw}
    #goalText b{font-size:16px}
    .arrow{font-size:16px}
    .card{padding:14px 14px}
    .card h1{font-size:19px;margin-bottom:3px}
    .card p{font-size:12px;margin:5px 0;line-height:1.55}
    .big{font-size:28px;margin:2px 0}
    .lvbtn{padding:7px 11px;font-size:13px;border-radius:11px}
    .tip{font-size:12px;padding:7px 10px;margin-top:6px;line-height:1.5}
    #panelScroll{max-height:50vh;grid-template-columns:1fr 1fr}
    .kv{font-size:12px}
    .sw{padding:6px 0;font-size:13px}
  }
  @media (max-height:640px){
    #topbar{height:calc(50px + env(safe-area-inset-top))}
    #goal{min-height:74px}
    .slot{min-width:36px;height:36px;font-size:16px}
    .big{font-size:22px}
    .card h1{font-size:17px}
    .card p{font-size:11px;margin:3px 0}
    .lvbtn{padding:6px 10px;font-size:12px}
    .tip{display:none}
  }
  /* 平板 / 大屏（≥600px）：舒展布局，内容不贴边、字号放大 */
  @media (min-width:600px){
    #topbar{gap:14px;padding-left:20px;padding-right:20px}
    #lvName{font-size:19px}
    #lvSub{font-size:13px}
    #stars{font-size:19px}
    .btn{padding:9px 16px;font-size:16px;border-radius:13px}
    #goal{gap:18px;padding-left:22px;padding-right:22px}
    .slot{min-width:68px;height:68px;border-radius:19px;font-size:32px}
    .slot small{font-size:12px}
    #goalText{font-size:16px}
    #goalText b{font-size:25px}
    .arrow{font-size:26px}
    .card{max-width:660px;padding:30px 34px;border-radius:26px}
    .card h1{font-size:29px}
    .card p{font-size:16px}
    .big{font-size:52px}
    .lvbtn{font-size:16px;padding:12px 16px;border-radius:15px}
    #panelScroll{grid-template-columns:1fr 1fr}
    .tip{font-size:14px}
  }
  /* iPad / 大屏竖屏（768~1024px）：加大触控热区与字号 */
  @media (min-width:768px) and (max-width:1024px){
    #topbar{gap:16px;padding-left:26px;padding-right:26px;height:calc(76px + env(safe-area-inset-top))}
    #lvName{font-size:21px} #lvSub{font-size:14px} #stars{font-size:21px}
    .btn{padding:11px 18px;font-size:17px;border-radius:14px}
    #goal{gap:20px;padding-left:28px;padding-right:28px;min-height:120px}
    .slot{min-width:80px;height:80px;border-radius:24px;font-size:40px}
    .slot small{font-size:13px}
    #goalText{font-size:18px;max-width:56vw} #goalText b{font-size:28px}
    .arrow{font-size:28px}
    .card{max-width:740px;padding:36px 42px} .card h1{font-size:32px} .card p{font-size:17px}
    .big{font-size:60px}
    .lvbtn{font-size:17px;padding:13px 18px;border-radius:16px}
    .tip{font-size:15px;padding:10px 14px}
  }
  /* 横屏（手机/iPad 横放）：纵向空间宝贵，压缩上下栏、slot 适中 */
  @media (orientation:landscape){
    #topbar{height:calc(50px + env(safe-area-inset-top));gap:8px;padding-left:16px;padding-right:16px}
    #lvName{font-size:15px} #lvSub{display:none} #stars{font-size:15px}
    .btn{padding:7px 13px;font-size:14px;border-radius:11px}
    #goal{min-height:80px;gap:12px;padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
    .slot{min-width:54px;height:54px;border-radius:15px;font-size:25px}
    .slot small{font-size:10px}
    #goalText{font-size:13px;max-width:48vw} #goalText b{font-size:20px}
    .arrow{font-size:20px}
    .card{max-width:680px;padding:24px 30px} .card h1{font-size:26px} .card p{font-size:15px}
    .big{font-size:42px}
    .lvbtn{font-size:15px;padding:10px 14px;border-radius:13px}
    .tip{font-size:13px}
  }
  /* 横屏大屏（iPad 横放 1194×834 / 1024×768）：slot 再放大一点 */
  @media (orientation:landscape) and (min-width:768px){
    #topbar{height:calc(58px + env(safe-area-inset-top))}
    #goal{min-height:96px}
    .slot{min-width:66px;height:66px;font-size:31px}
    #goalText{font-size:15px;max-width:56vw} #goalText b{font-size:24px}
    .card{max-width:820px}
    .tip{font-size:14px}
  }
  /* 微信等内置浏览器下拉露出白色背景时兜底 */
  #stage{background:#05060f}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="splash">
  <style>
    #splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 38%,#1a2350,#05060f);
      display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;font-family:"Segoe UI",Arial,"Microsoft YaHei",sans-serif}
    #splash.hide{opacity:0;pointer-events:none}
    #splash .si{text-align:center;color:#eaf0ff}
    #splash .emo{font-size:64px;animation:spf 2.4s ease-in-out infinite}
    #splash .ti{font-size:22px;font-weight:800;margin-top:10px}
    #splash .sp{width:34px;height:34px;margin:18px auto 6px;border:3px solid rgba(255,255,255,.2);border-top-color:#8aa6ff;border-radius:50%;animation:spn 1s linear infinite}
    #splash .tp{font-size:14px;opacity:.8}
    #splash .hn{font-size:12px;opacity:0;margin-top:14px;max-width:280px;line-height:1.6;color:#cdd6ff;animation:fdin 1s ease 6s forwards}
    @keyframes spn{to{transform:rotate(360deg)}}
    @keyframes spf{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes fdin{to{opacity:.62}}
  </style>
  <div class="si">
    <div class="emo">🕳️</div>
    <div class="ti">黑洞入侵 · 拼音大作战</div>
    <div class="sp"></div>
    <div class="tp">正在点亮拼音星系…</div>
    <div class="hn">若长时间未进入，可能是网络较慢。可点右上角「…」选择「在浏览器打开」，或下拉刷新重试。</div>
  </div>
</div>

<header id="topbar" class="ui">
  <button class="btn" id="btnMenu">☰ 关卡</button>
  <div id="lvBox">
    <div id="lvName">黑洞入侵 · 拼音大作战</div>
    <div id="lvSub">点一下拼音星球，黑洞就会飞过去把它吸走</div>
  </div>
  <div class="spacer"></div>
  <div id="stars">⭐ 0</div>
  <button class="btn on" id="btnVoice" title="朗读开关">🔊</button>
  <button class="btn" id="btnSet" title="老师设置">⚙</button>
  <button class="btn" id="btnRedo" title="重来本关" style="display:none">↻</button>
</header>

<div id="goal" class="ui">
  <div id="goalLeft"></div>
  <div id="goalText">准备好了吗？出发！</div>
</div>

<!-- 开始页 -->
<div class="mask" id="startMask">
  <div class="card">
    <div class="big">🕳️</div>
    <h1>黑洞入侵 · 拼音大作战</h1>
    <p>一个贪吃的黑洞闯进了拼音星系。<br>
       <b style="color:#ffd166">点一下拼音星球</b>，黑洞就会飞过去把它吸进去，<br>
       然后<b style="color:#ffd166">大声读出它的发音</b>！</p>
    <div class="row">
      <button class="btn" id="btnStart" style="font-size:19px;padding:14px 30px;background:linear-gradient(135deg,#6ea8ff,#8f6eff);border:none;font-weight:700">▶ 开始游戏</button>
      <button class="btn" id="btnTeacher">👩‍🏫 老师须知</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="btnProgStart">📊 家长看进度</button>
      <button class="btn" id="btnDiffStart">🎚 难度分层</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="btnMistake">📕 错题本</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="btnClean" style="font-size:13px;opacity:.9">🧹 清理缓存 · 用最新版</button>
      <button class="btn" id="btnCopyLink" style="font-size:13px;opacity:.9">📋 复制最新版链接</button>
    </div>
    <div class="tip" id="voiceState">正在检测发音引擎…</div>
  </div>
</div>

<!-- 过关页 -->
<div class="mask hide" id="winMask">
  <div class="card">
    <div class="big" id="winEmoji">🎉</div>
    <h2 id="winTitle">太棒了！</h2>
    <p id="winDesc">这一关的拼音都被黑洞吃掉啦！</p>
    <div class="row">
      <button class="btn" id="btnNext" style="font-size:18px;padding:12px 26px;background:linear-gradient(135deg,#6ea8ff,#8f6eff);border:none;font-weight:700">下一关 ▶</button>
      <button class="btn" id="btnRetry">再玩一次</button>
      <button class="btn" id="btnBack2">关卡列表</button>
    </div>
  </div>
</div>

<!-- 关卡 / 设置面板 -->
<div class="mask hide" id="panel">
  <div class="card" style="position:relative">
    <span class="close" id="panelClose">✕</span>
    <h1 style="font-size:22px" id="panelTitle">选择关卡</h1>
    <div id="panelScroll"></div>
    <div id="panelExtra"></div>
  </div>
</div>

<script>
/* ============================================================
   黑洞入侵 · 拼音大作战
   幼小衔接拼音学习游戏 —— 单文件 / 零依赖 / 离线可玩
   ============================================================ */

/* ---------- 1. 拼音数据 ---------- */
// 声母（显示为拼音，朗读时用示例汉字，TTS 读汉字最准）
var SHENGMU = [
  ['b','玻'],['p','坡'],['m','摸'],['f','佛'],
  ['d','得'],['t','特'],['n','讷'],['l','勒'],
  ['g','哥'],['k','科'],['h','喝'],
  ['j','鸡'],['q','七'],['x','西'],
  ['zh','知'],['ch','吃'],['sh','诗'],['r','日'],
  ['z','资'],['c','次'],['s','思'],
  ['y','衣'],['w','乌']
];
// 韵母
var YUNMU = [
  ['a','啊'],['o','喔'],['e','鹅'],['i','衣'],['u','乌'],['ü','鱼'],
  ['ai','爱'],['ei','诶'],['ui','威'],['ao','熬'],['ou','欧'],['iu','优'],
  ['ie','耶'],['üe','约'],['er','儿'],
  ['an','安'],['en','恩'],['in','因'],['un','温'],['ün','晕'],
  ['ang','昂'],['eng','鞥'],['ing','英'],['ong','轰']
];
var PIN = {}; // id -> {py, say, kind}
SHENGMU.forEach(function(a){ PIN[a[0]] = {py:a[0], say:a[1], kind:'sm'}; });
YUNMU.forEach(function(a){ PIN[a[0]] = {py:a[0], say:a[1], kind:'ym'}; });

// 声调示范（用于读“第几声”）
var TONE_DEMO = [
  {t:1, mark:'ˉ', name:'一声', say:'妈'},
  {t:2, mark:'ˊ', name:'二声', say:'麻'},
  {t:3, mark:'ˇ', name:'三声', say:'马'},

};
function markTone(sy, tone){
  if(!tone) return sy;
  var v = null;
  if(sy.indexOf('a')>=0) v='a';
  else if(sy.indexOf('o')>=0) v='o';
  else if(sy.indexOf('e')>=0) v='e';
  else if(sy.indexOf('iu')>=0) v='u';
  else if(sy.indexOf('ui')>=0) v='i';
  else if(sy.indexOf('i')>=0) v='i';
  else if(sy.indexOf('u')>=0) v='u';
  else if(sy.indexOf('ü')>=0) v='ü';
  if(!v) return sy;
  var i = sy.indexOf(v);
  return sy.slice(0,i) + TONE_CHARS[v][tone] + sy.slice(i+1);
}

   识字 01-10 启蒙 ★，11-20 巩固 ★★，21-30 提升 ★★★；拼音自由关中等，拼读关最高。 */
LEVELS.forEach(function(L,i){
  if(L.type==='zi')         L.diff = (i<10?1 : i<20?2 : 3);
  else if(L.type==='spell') L.diff = 3;
  else                      L.diff = 2;
});
function diffStar(d){ return d===1?'★':(d===2?'★★':'★★★'); }
function diffDesc(d){ return diffStar(d)+' '+(d===1?'启蒙':(d===2?'巩固':'提升')); }

/* 版本号：每次发布改一次。音频文件带 ?v= 防止被浏览器 / 中间层缓存成旧发音包，
    「复制最新版链接」也用同一个号，别人点开一定是当次发布的内容。 */
var BUILD = 'v13';
/* 是否在微信内置浏览器（X5 / WKWebView）。微信 WebView 不支持文件下载，
   一旦触发 <a download> 就会弹「请在外部浏览器打开」。这里统一判一下，
   导出进度时改走「长按复制文本」，避免那条提示。 */
var IS_WX = /MicroMessenger/i.test(navigator.userAgent || '');
var justUnlocked = -1;   // 刚通关后“新解锁的下一关”索引，openLevels 渲染时做高亮过场
var CUSTOM = [];   // 家长/老师导入的「我的字表」（{zi,py} 列表），v8 新增

/* ---------- 3. 发音引擎 TTS：本机中文语音（失败自动降级在线合成） ---------- */
var Voice = {
  ok:false, voice:null, state:'检测中', tried:false,
  /* 微信 / QQ 内置浏览器（X5 内核）最常见的坑：getVoices() 里明明有中文语音条目，
     但 speak() 静默失败——既不出声也不报错。所以必须区分「有条目」和「真的出过声」。
     zhState: unknown=还没结论 | good=实测出过声 | bad=实测不出声 */
  zhState:'unknown', probeRun:false,
  lastTry:0, lastText:'', relayedAt:0, relayedText:'',   // 同句去重：防止 TTS / 在线合成 / 补读三路抢着出声
  payPending:true,                                       // 当前这句是否还欠一次在线补位
  works:function(){ return this.zhState==='good'; },     // 本机中文语音确实会出声吗
  init:function(){
    var self=this;
    if(!('speechSynthesis' in window)){
      self.state='浏览器不支持本机语音，将自动使用在线合成音';
      self.ok=false; self.paint(); return;
    }
    function pick(){ self.ensure(); self.paint(); }
    pick();
    try{ speechSynthesis.onvoiceschanged = pick; }catch(e){}
    // 中文音色在不少内核里是异步后才出现的（微信/X5 尤其明显），多探几次
    [200,600,1200,2500,4500,8000].forEach(function(t){ setTimeout(pick,t); });
    setTimeout(function(){ self.probe(); }, 900);   // 实测一次，尽早拿到「到底出不出声」的结论
  },
  /* 探针：真送一次本机中文语音，看它到底出不出声。
     静默失败（不报错、也不 onstart）是最坑的，只能靠超时判定。 */
  probe:function(){
    if(this.probeRun || this.zhState==='good' || !('speechSynthesis' in window)) return;
    this.probeRun=true;
    var self=this, done=false, isProbe=true, zi=true;   // 探针句是汉字「啊」，汉字口径处理
    try{
      try{ speechSynthesis.cancel(); }catch(e){}
      var v=this.ensure();
      if(!v){ this.zhState='bad'; this.state='本机没有中文语音，汉字自动使用在线合成音'; self.paint(); return; }
      var u=new SpeechSynthesisUtterance('啊');
      u.lang='zh-CN'; u.rate=0.9; u.volume=1;
      if(v) u.voice=v;
      u.onstart=function(){ if(!done){ done=true; self.zhState='good'; self.state='发音引擎已就绪：'+self.voice.name; self.paint(); } };
      u.onerror=function(){
        if(done) return; done=true;
        var e=String(((u.error&&u.error)||'')+'');
        /* not-allowed / interrupted 之类通常是「还没被用户手势解锁」（微信里先点一下页面就好），
           不能据此判死 TTS，否则孩子永远只能用在线合成音。 */
        if(zi && !/not-allowed|interrupted|canceled|audio-busy/i.test(e)){ self.zhState='bad'; self.paint(); }
        /* probe() 作用域里没有 txt/rate 变量（探针句固定为「啊」、rate 0.9），
           原先直接引用会抛 ReferenceError: txt is not defined —— 一旦本机 TTS 探针
           走到 onerror（如 headless / 无声卡环境），整条补位链就断了。 */
        self.needRelay('啊', 0.9, zi);
      };
      speechSynthesis.speak(u);
      setTimeout(function(){            // 静默失败：等 1.2s 还没 onstart，判为不出声
        if(isProbe && !done){ done=true; self.zhState='bad';
          self.state='本机语音在当前浏览器不出声（多为微信内置浏览器限制），汉字自动使用在线合成音'; self.paint(); }
      }, 1200);
    }catch(e){ this.zhState='bad'; this.state='本机语音不可用，汉字自动使用在线合成音'; this.paint(); }
  },
  paint:function(){
    var el=document.getElementById('voiceState');
    if(el) el.textContent = this.state + (this.ok?'':'（将自动改用在线合成音；用 Edge / Chrome 可启用本机中文语音）');
  },
  ensure:function(){                       // 每次朗读前复查，别用 Init 时的一次性结论
    var vs=[];
    try{ vs = speechSynthesis.getVoices()||[]; }catch(e){ vs=[]; }
    var zh=vs.filter(function(v){ return /zh|CN|Chinese|中文/i.test((v.lang||'')+' '+(v.name||'')); });
    if(!zh.length) return null;
    this.voice = zh.filter(function(v){return /female|yaoyao|huihui|xiaoxiao|ting|婷|女|晓|mei|美/i.test(v.name||'');})[0] || zh[0];
    if(!this.ok){ this.ok=true; this.state='发音引擎已就绪：'+this.voice.name; }
    return this.voice;
  },
  speak:function(text, rate){
    if(!S.voiceOn || !text) return;
    var self=this, started=false, txt=String(text);
    // 同一句 150ms 内不重复送 TTS：cancel+speak 立刻再来一次会被内核当垃圾丢弃
    var now=Date.now();
    if(txt===this.lastText && now-this.lastTry<150) return;
    this.lastText=txt; this.lastTry=now;
    var zi = /[\u4e00-\u9fa5]/.test(txt.charAt(0));
    this.payPending = true;                       // 这一句允许补位一次（下面的闸门会消费掉）
    if(!('speechSynthesis' in window)){ this.needRelay(txt, rate, zi); return; }
    try{
      try{ speechSynthesis.cancel(); }catch(e){}
      var v=this.ensure();
      var u=new SpeechSynthesisUtterance(txt);
      u.lang='zh-CN'; u.rate=rate||0.82; u.pitch=1.05; u.volume=1;
      if(v) u.voice=v;
      u.onstart=function(){ started=true; self.tried=true; if(zi) self.zhState='good'; };
      u.onerror=function(){
        if(started) return;
        self.tried=true;
        var e=String(((u.error&&u.error)||'')+'');
        if(zi && !/not-allowed|interrupted|canceled|audio-busy/i.test(e)) self.zhState='bad';
        self.needRelay(txt, rate, zi);
      };
      speechSynthesis.speak(u);
      /* 兜底：有些内核 speak() 不报错但根本不出声，超时后切在线合成。
         汉字（识字关）必须给本机中文语音足够启动时间——真机首次朗读常 >420ms 才 onstart，
         抢太早就会「在线音 + TTS」两路叠在一起，听着就是一片“滴滴”。 */
      setTimeout(function(){ if(!started) self.needRelay(txt, rate, zi); }, zi?1100:420);
    }catch(e){ this.needRelay(txt, rate, zi); }
  },
  /* 补位闸门：catch / onerror / 超时定时器 / assertVoice 四条兜底通道都走这里，
     一句（一次点击）只允许真正补一次在线合成，否则会连播好几轮 = 一片“滴滴”。 */
  needRelay:function(txt, rate, zi){
    if(!this.payPending) return;
    this.payPending = false;
    this.relay(txt, rate, zi);
  },
  relay:function(text, rate, zi){          // 本机语音不可用 / 不出声 -> 在线合成
    if(!S.voiceOn || !text) return;
    var now=Date.now(), txt=String(text);
    if(zi) txt = ZI_TS[txt] || txt;        // 在线合成读双字词才不会读错多音字
    if(Sound.bad[txt]) return;
    // 汉字：只有实测确认本机中文语音真的会出声，才信它、不抢；
    // 否则（典型：微信 X5 有中文条目但静默不出声）必须补在线合成，不然孩子点一个字一声都没有。
    if(zi && this.works()) return;
    // 补位去重：一次点击最多补一次在线合成。三条兜底通道（420/1100/560ms）共用，
    // 不去重就会连播好几轮，听起来就是一片“滴滴”。
    if(now - this.relayedAt < 1800) return;
    if(txt===this.relayedText && now - this.relayedAt < 3000) return;
    this.relayedAt=now; this.relayedText=txt;
    try{
      Sound.goOnline(text);
    }catch(e){ Sound.bad[text]=1; }
  }
};

/* ---------- 3.5 发音出口：本地音频包 -> 在线接口 -> 本机语音 ---------- */
function akey(s){ return String(s).replace(/\u00fc/g,'v'); }   // u00fc(ü) -> v，文件名安全
var Sound = {
  base:'audio/', cache:{}, bad:{}, cur:null, unlocked:false, lastSaid:0,
  online:function(t){ return 'https://fanyi.baidu.com/gettts?lan=zh&text='+encodeURIComponent(t)+'&spd=2&source=web'; },
  file:function(key){ return this.base + akey(key) + '.mp3?v=' + BUILD; },
  ziFile:function(zi){ var n=ZI_AUDIO[zi]; return n ? (this.base + n + '.mp3?v=' + BUILD) : ''; },
  warm:function(keys){ // 关卡开始前预下载，点击后立刻出声
    var self=this;
    (keys||[]).forEach(function(k){
      if(!k) return;
      // 汉字：预取本地音频包（离线预生成，100% 有声）；万一缺包再退回在线合成
      if(/[\u4e00-\u9fa5]/.test(String(k).charAt(0))){
        var f=self.ziFile(k);
        if(f){ var za=new Audio(); za.preload='auto'; za.oncanplay=function(){ self.cache[k]=za; }; za.onerror=function(){ self.bad[k]=1; }; za.src=f; za.load(); return; }
        self.pre(self.online(ZI_TS[k]||k)); return;
      }
      if(self.cache[k] || self.bad[k]) return;
      var a=new Audio(); a.preload='auto';
      a.oncanplay=function(){ self.cache[k]=a; };
      a.onerror=function(){ self.bad[k]=1; };
      a.src=self.file(k); a.load();
    });
  },
  pre:function(url){ try{ var a=new Audio(); a.preload='auto'; a.src=url; }catch(e){} },
  unlock:function(){ // 移动端首次点击解锁音频播放
    if(this.unlocked) return; this.unlocked=true;
    try{
      var a=new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
      var pr=a.play(); if(pr&&pr.catch) pr.catch(function(){});
    }catch(e){}
  },
  say:function(text, key){
    if(!S.voiceOn || !text) return;
    var self=this, id=key||text, t=String(text||id);
    this.lastSaid=Date.now();
    Voice.payPending=false;      // 本次走的是本地/在线音频包，不欠在线合成这一环
    // 汉字 = 识字关星球 / 拼读结果。走本地音频包（离线预生成的 mp3）：
    // 不依赖浏览器 TTS，也不调第三方在线接口——微信/QQ 内置浏览器里也保证一点就响。
  if(/[\u4e00-\u9fa5]/.test(String(id).charAt(0))){
    if(this.cache[id] && !this.bad[id]){ this.go(this.cache[id]); return; }
    if(!ZI_AUDIO[id]){ sayUnknown(id, t); return; }   // 自定义 / 未知汉字：优先离线 blob，否则在线合成
    var self2=this, zf=this.ziFile(id), ze=new Audio();
      ze.preload='auto';
      ze.oncanplay=function(){ self2.cache[id]=ze; };
      ze.onerror=function(){                    // 本地包缺失（极少见）-> 在线合成 -> 本机语音
        self2.bad[id]=1; self2.goOnline(ZI_TS[t] || t);
      };
      ze.src=zf; this.go(ze);
      return;
    }
    if(this.cache[id] && !this.bad[id]){ this.go(this.cache[id]); return; }
    var el=new Audio(); el.preload='auto';
    el.oncanplay=function(){ self.cache[id]=el; };
    el.onerror=function(){                       // 本地缺失 -> 在线合成
      var e2=new Audio();
      e2.oncanplay=function(){ self.cache[id]=e2; };
      e2.onerror=function(){ Voice.speak(text, 0.75); };   // 再不行 -> 本机语音
      e2.src=self.online(text);
      self.go(e2);
    };
    el.src=this.file(id);
    this.go(el);
  },
  /* 汉字专用出口：直接走在线合成音（不依赖本机 TTS，任何浏览器都能响）。
     读的是「多音字双字词」，比如 发->头发、只->一只、乐->快乐，保证读音对。 */
  goOnline:function(word){
    if(!S.voiceOn) return;
    var w=String(word), a=new Audio(this.online(w)), beat=false;
    a.oncanplay=function(){ if(beat) return; beat=true; Sound.go(a); };
    a.onerror=function(){ if(beat) return; beat=true; Sound.bad[w]=1; };
    a.preload='auto'; a.load();
  },
  go:function(el){
    if(this.cur && this.cur!==el){ try{ this.cur.pause(); this.cur.currentTime=0; }catch(e){} }
    this.cur=el;
    try{ el.currentTime=0; var pr=el.play(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}
  },
  /* 发声保险：被黑洞吃掉之后，如果既没在说话也没在放音频，就直接 TTS 补读一次。
     stamp 用来避免“后一次 say 已经接手”时旧定时器重复读两遍。 */
  assertVoice:function(text, rate){
    var self=this, stamp=this.lastSaid;
    setTimeout(function(){
      try{
        if(!S.voiceOn || !text || self.lastSaid!==stamp) return;
        var talking=false;
        try{ if('speechSynthesis' in window && (speechSynthesis.speaking||speechSynthesis.pending)) talking=true; }catch(e){}
        if(talking) return;
        if(self.cur){ try{ if(self.cur.currentTime>0.05 && !self.cur.paused) talking=true; }catch(e){} }
        if(talking) return;
        /* 汉字：已经交给 TTS（含它自己的 1.1s 在线兜底），这里绝不插第二遍 TTS，
           否则一次点击会同时响「在线合成 + 本机语音」两路。
           只有本机确实没有中文音色时，才让在线合成补位（relay 内部还有 1.4s 去重）。 */
        if(/[\u4e00-\u9fa5]/.test(String(text).charAt(0))){
          /* 汉字现在走本地音频包，上面 cur 播放中就会被 talking 拦住。
             真的连本地包都没响（极少见），才退回在线合成补位，避免留白。 */
          if(!talking && !self.cache[text] && !ZI_AUDIO[text]) Voice.needRelay(ZI_TS[text]||text, rate||0.85, true);
          return;
        }
        Voice.speak(text, rate||0.85);
      }catch(e){}
    }, 560);
  }
};

/* ---------- 3.55 自定义字离线音频缓存（IndexedDB） ----------
   自定义字不在本地 303 条 mp3 包里。导入时预热在线合成音（填 HTTP 缓存，首播即响、同设备可能离线），
   并尝试验证跨域抓取成 blob 存 IndexedDB：若源站允许 CORS 则真正离线可用；否则 fetch 被拦、静默失败，
   回退到「在线合成音」（联网即响，微信 WebView 也支持跨域媒体播放）。绝不依赖系统 TTS 兜底。 */
var AudioCache = {
  db:null,
  open:function(){
    var self=this;
    return new Promise(function(res){
      if(self.db){ res(self.db); return; }
      try{
        if(!('indexedDB' in window)){ res(null); return; }
        var rq=indexedDB.open('bhpy_audio', 1);
        rq.onupgradeneeded=function(e){ var db=e.target.result; if(db && !db.objectStoreNames.contains('audio')) db.createObjectStore('audio'); };
        rq.onsuccess=function(e){ self.db=e.target.result; res(self.db); };
        rq.onerror=function(){ res(null); };
      }catch(e){ res(null); }
    });
  },
  put:function(key, blob){
    var self=this;
    return self.open().then(function(db){
      if(!db) return false;
      return new Promise(function(res){
        try{
          var tx=db.transaction('audio','readwrite');
          tx.objectStore('audio').put(blob, key);
          tx.oncomplete=function(){ res(true); };
          tx.onerror=function(){ res(false); };
        }catch(e){ res(false); }
      });
    });
  },
  get:function(key){
    var self=this;
    return self.open().then(function(db){
      if(!db) return null;
      return new Promise(function(res){
        try{
          var tx=db.transaction('audio','readonly');
          var rq=tx.objectStore('audio').get(key);
          rq.onsuccess=function(){ res(rq.result||null); };
          rq.onerror=function(){ res(null); };
        }catch(e){ res(null); }
      });
    });
  }
};
function warmCustomAudio(chars){
  (chars||[]).forEach(function(c){
    if(ZI_AUDIO[c]) return;                     // 本地包已有，无需预热
    var url=Sound.online(ZI_TS[c]||c);
    try{ var a=new Audio(); a.preload='auto'; a.src=url; }catch(e){}   // 预热 HTTP 缓存
    try{                                         // 尝试抓 blob 离线存（CORS 通不过则静默失败）
      fetch(url).then(function(r){ return (r && r.ok) ? r.blob() : null; }).then(function(b){
        if(b && b.size) AudioCache.put(c, b);
      }).catch(function(){});
    }catch(e){}
  });
}
function sayUnknown(id, text){                    // 自定义 / 未知汉字：优先离线 blob，否则在线合成
  var self=Sound, t=String(text||id);
  AudioCache.get(id).then(function(blob){
    try{
      if(blob && blob.size){
        var u=URL.createObjectURL(blob), a=new Audio(); a.preload='auto';
        a.onerror=function(){ self.goOnline(ZI_TS[t]||t); };
        a.src=u; self.go(a); return;
      }
    }catch(e){}
    var ze=new Audio(); ze.preload='auto';
    ze.oncanplay=function(){ self.cache[id]=ze; };
    ze.onerror=function(){ self.goOnline(ZI_TS[t]||t); };
    ze.src=''; self.go(ze);                       // 空 src 触发 onerror -> 在线合成
  });
}

/* ---------- 3.6 缓存清理：微信 / QQ 内置浏览器缓存极硬 ----------
   微信里同一条链接可能把旧版 index.html 和旧 audio/*.mp3 缓存好几周，
   光在服务器上覆盖文件是不够的，客户端根本不会重新来请求。
   这里提供两条路：① 本页清缓存后带版本号重新加载；② 复制一条全新链接发群里，
   别人点开是全新 URL，100% 拿到最新版。学习进度存在 localStorage，两种操作都不会丢。 */
function pageURL(v){ return location.origin + location.pathname + (v ? ('?v=' + v) : ''); }
function clearCacheThenReload(){
  var n=0;
  try{                                   // 清 Cache API（微信 X5 会用它缓存整页）
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){
        ks.forEach(function(k){ try{ caches.delete(k); n++; }catch(e){} });
      });
    }
  }catch(e){}
  try{ if(window.applicationCache && applicationCache.update) applicationCache.update(); }catch(e){}
  try{ localStorage.removeItem('bhpy_cache_ver'); }catch(e){}
  try{ location.replace(pageURL(BUILD + '-r' + (Date.now() % 100000))); }catch(e){}
  try{ location.href = pageURL(BUILD + '-r' + (Date.now() % 100000)); }catch(e){}
}
function copyNewLink(){
  var u = pageURL(BUILD), done = function(ok){
    alert((ok ? '已复制最新版本链接：\n\n' : '请长按地址栏复制这个链接：\n\n')
      + u + '\n\n把这个新链接发到微信群，家长和孩子点开就是最新版，不受手机缓存影响。');
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(function(){ done(true); }, function(){ legacy(); });
      return;
    }
  }catch(e){}
  legacy();
  function legacy(){                     // 无 clipboard API（微信内置浏览器常见）：老办法 fallback

var cv=document.getElementById('stage'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;

/* iPad 横屏「显示不全」的根因与修法（2026-10-07）
   ------------------------------------------------------------------
   症状：iPad Safari / 微信 WebView 横屏打开，卡片全挤在屏幕顶部一条窄带里，
        下方大片空白，看起来像「画布只显示了上半屏」。

   根因：旧版 resize() 把 canvas 尺寸写成  H = min(clientHeight, innerHeight,
        visualViewport.height, documentElement.clientHeight)。
        这 4 个来源在 iPad 上并不一致 —— documentElement.clientHeight 在横屏/
        桌面模式下常返回**上一帧甚至竖屏的陈旧值**（实测可返回 390 而真实视口 820）。
        Math.min() 只要碰到一个坏值就把整个高度拉低：820 的视口被算成 390，
        场地高度只剩 170px，只够铺 1.6 行卡片 → 卡片挤成一条带，下方全空。
        更糟的是 cv.style.height 被写死后，下一帧 cv.clientHeight 读到的就是这个
        坏值，与其它来源再取 min，形成**自锁死循环**，画布再也长不回来。

   修法：
     ① 以 canvas 自身 getBoundingClientRect() 为唯一权威尺寸。
        #stage 是 position:fixed;width:100%;height:100%，浏览器布局完成后
        它的 rect 就是真实可视区，不依赖任何内核「自报」的视口高度。
     ② 其它来源只在 rect 不可用（首帧布局未完成）时才作为兜底，
        且取 min 的语义仅限于「宁可小不可溢出」，绝不让单个坏值主导尺寸。
     ③ 加合理性下限：算出的高度若明显小于视口（差 >80px），判定为坏值并回退，
        避免任何内核再把画布锁死。 */

/* 取可信的视口尺寸：优先 rect，其次 rect 自身尺寸，最后才用内核自报值兜底 */
function measure(){
  var rect=null;
  try{ rect=cv.getBoundingClientRect(); }catch(e){}
  var rw=rect? Math.round(rect.width||0) :0;
  var rh=rect? Math.round(rect.height||0) :0;
  var cw=Math.round(cv.clientWidth||0), ch=Math.round(cv.clientHeight||0);
  // rect 与 clientWidth/clientHeight 同源（元素真实渲染尺寸），取较大者更抗 0 值
  var w=Math.max(rw,cw,0), h=Math.max(rh,ch,0);
  if(w>0 && h>0) return {w:w, h:h, fromRect:true};
  // 兜底：rect 不可用时才问内核要尺寸，并取 min 防止溢出
  var iw=window.innerWidth||0, ih=window.innerHeight||0;
  var vv=window.visualViewport||null;
  var vw=(vv&&vv.width)||0, vh=(vv&&vv.height)||0;
  var de=document.documentElement||null;
  var dw=(de&&de.clientWidth)||0, dh=(de&&de.clientHeight)||0;
  var fw=Math.max(iw,vw,dw,cw,1), fh=Math.max(ih,vh,dh,ch,1);
  var bw=Math.min.apply(null,[iw||fw, vw||fw, dw||fw, cw||fw]);
  var bh=Math.min.apply(null,[ih||fh, vh||fh, dh||fh, ch||fh]);
  return {w:Math.max(1,bw), h:Math.max(1,bh), fromRect:false};
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  var m=measure();
  W=Math.max(1, m.w); H=Math.max(1, m.h);
  /* 防自锁：若 rect 来源可用，却比内核自报视口小 80px 以上，说明内核某来源返回了
     陈旧值（iPad 横屏高发）。此时以 rect 为准——它本来就是布局的真实结果，
     宁可让卡片贴到底部，也不能把画布锁成一条。*/
  if(m.fromRect){
    var iw0=window.innerWidth||0, ih0=window.innerHeight||0;
    var vv0=window.visualViewport||null;
    var de0=document.documentElement||null;
    var vh0=(vv0&&vv0.height)||0, dh0=(de0&&de0.clientHeight)||0;
    var refH=Math.max(ih0,vh0,dh0,H);   // 只用「偏大」的方向做上界参考
    if(refH-H>80) H=Math.max(H, refH);  // 明显被拉低 → 回退到视口高度
    var refW=Math.max(window.innerWidth||0,(vv0&&vv0.width)||0,((de0&&de0.clientWidth)||0),W);
    if(refW-W>80) W=Math.max(W, refW);
  }
  // 双保险：同步写死 CSS 尺寸，杜绝任何内核把 canvas 按属性值放大显示
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 160); });
if(window.visualViewport){
  try{
    window.visualViewport.addEventListener('resize', resize);
    window.visualViewport.addEventListener('scroll', function(){ setTimeout(resize, 60); });
  }catch(e){}
}

setTimeout(resize, 60);

var ARENA={x0:0,y0:0,x1:0,y1:0};
function layout(){
  var tb=document.getElementById('topbar'), go=document.getElementById('goal');
  var short=(H<720);
  var top=(tb?tb.offsetHeight:64)+(short?10:18);
  var gh=go?go.offsetHeight:104;
  var spell=S.level && S.level.type==='spell';
  var bottom=gh+(spell?(short?60:96):(short?14:28));
  var side=Math.max(20,Math.min(W<720?48:64, W*(short?0.075:0.09)));
  // 场地保底高度：顶栏/底卡把屏幕挤扁时，优先压缩四周留白而不是让星球没地方放
  var need=Math.min(210, Math.max(120, H*0.34));
  var room=H-top-28-bottom;
  if(room<need){
    top=Math.max(20, top-Math.min(need-room, Math.max(0, top-20)));
    room=H-top-28-bottom;
    if(room<need){ bottom=Math.max(40, bottom-(need-room)); }
  }
  ARENA={x0:side,y0:top+28,x1:W-side,y1:H-bottom};
  S.planets.forEach(function(p){
    p.x=Math.max(ARENA.x0+p.r, Math.min(ARENA.x1-p.r, p.x));
    p.y=Math.max(ARENA.y0+p.r, Math.min(ARENA.y1-p.r, p.y));
  });
  // 横竖屏切换后，黑洞若仍停在旧坐标系位置会跑到屏外 → 一并夹回可视场地
  if(S.bh){
    var r2=S.bh.r*0.2;
    S.bh.x=Math.max(ARENA.x0+r2, Math.min(ARENA.x1-r2, S.bh.x));
    S.bh.y=Math.max(ARENA.y0+r2, Math.min(ARENA.y1-r2, S.bh.y));
    if(S.bh.tx!==undefined){ S.bh.tx=Math.max(0,Math.min(W,S.bh.tx)); S.bh.ty=Math.max(0,Math.min(H,S.bh.ty)); }
  }
}

/* ---------- 7. 生成星球 ---------- */
function mkPlanet(id, kind){
  var d=PIN[id]||{py:id, say:id, zi:id, em:'', kind:kind};
  // 识字星球：每颗按字分配外形 + 配色（形状/颜色各不相同，孩子一眼就分得清）
  var ci = (typeof d.ci==='number') ? d.ci : (hzHash(id)>>>5) % ZI_COLORS.length;
  var pal = ZI_COLORS[ci];
  return {id:id, py:d.py, say:d.say, zi:d.zi||d.py, em:d.em||'', kind:d.kind||kind,
    shape:d.shape||'circle', c1:pal[0], c2:pal[1],
    x:0,y:0,r:0, vx:(Math.random()-0.5)*14, vy:(Math.random()-0.5)*14,
    st:'alive', cap:0, ca0:0, cr0:0, respawn:0, spin:Math.random()*6, glow:0,
    in:0, inD:0, pop:0};   // in/inD=弹入进度/错峰延迟，pop=点按脉冲
}
function clearOfBH(p){ // 与黑洞当前位置及停泊点保持安全距离，避免开局/重生被误吞
  var b=S.bh; if(!b) return true;
  var d1=Math.hypot(b.x-p.x, b.y-p.y), d2=Math.hypot(b.tx-p.x, b.ty-p.y);
  return d1 > b.r*3.4 + p.r && d2 > b.r*3.4 + p.r;
}
function spawn(list){
  var n=list.length, dk=diffOn();
  var area=(ARENA.x1-ARENA.x0)*(ARENA.y1-ARENA.y0);
  // 星球大小随难度档缩放：轻松档更大更好点，挑战档更小更费眼神
  var r=Math.max(15, Math.max(H<720?18:24, Math.min(W<560?46:56, Math.sqrt(area/Math.max(n,1))*0.34))*dk.rk);
  var gap=r*2.35;
  S.planets=list.map(function(id){ var p=mkPlanet(id); p.r=r; return p; });
  S.planets.forEach(function(p,i){ p.inD=i*0.055; });   // 开局错峰弹入，替代「凭空出现」
  S.planets.forEach(function(p,i){
    var ok=false, tries=0;
    while(!ok && tries++<300){
      p.x=ARENA.x0+p.r+Math.random()*(ARENA.x1-ARENA.x0-p.r*2);
      p.y=ARENA.y0+p.r+Math.random()*(ARENA.y1-ARENA.y0-p.r*2);
      ok=clearOfBH(p);
      for(var j=0;j<i && ok;j++){ var q=S.planets[j];
        if(Math.hypot(q.x-p.x,q.y-p.y) < gap){ ok=false; } }
    }
  });
}
function toneBalls(){

/* ---------- 8. 关卡流程 ---------- */
/* 关卡令牌 + 延时队列（2026-10-07）
   ---------------------------------------------------------------
   背景：吃掉最后一张卡后要等 900ms 才弹通关窗（setTimeout(finish,900)），
   拼读关还有 1500ms 复读、2300ms 切下一题。这些延时任务原先**没有归属关卡**，
   玩家若在窗口期内点「下一关 / 重试」，旧的 finish() 照样到点执行，
   会把新关卡强制切回 win 场景 —— 游戏卡死，必须刷新才能继续（已用探针复现）。
   修法：每次 startLevel 递增 S.lvToken；所有关卡内延时都用 lvLater() 包一层，
   回调先校验令牌，令牌不符就丢弃。切关时再 clearTimeout 掉全部挂起任务。*/
function lvLater(fn, ms){
  var tk=S.lvToken;
  var id=setTimeout(function(){
    var k=S.pTimers.indexOf(id); if(k>=0) S.pTimers.splice(k,1);
    if(S.lvToken!==tk) return;   // 已经切到别的关卡 → 这条延时作废
    fn();
  }, ms);
  S.pTimers.push(id);
  return id;
}
function lvClearTimers(){
  for(var i=0;i<S.pTimers.length;i++){ try{ clearTimeout(S.pTimers[i]); }catch(e){} }
  S.pTimers.length=0;
}
function warmList(){ // 本关需要预热的音频 key
  var out=[];
  if(S.level.type==='free'){ S.level.set.forEach(function(id){ out.push(akey(id)); }); }
  else if(S.level.type==='zi'){
    S.level.set.forEach(function(id){ out.push(id); });   // 汉字本地音频包（含自定义字在线预热）
    S.level.set.forEach(function(id){ out.push(PIN[id]?PIN[id].say:id); });  // 兜底（缺包时用）
  }
  else{
    S.level.tasks.forEach(function(t){
      out.push(akey(t.sm)); out.push(akey(t.ym)); out.push(akey(t.sm+t.ym+t.t));
    });
    TONE_DEMO.forEach(function(d){ out.push('t'+d.t); });
  }
  return out;
}
function startLevel(i, forceLv){
  lvClearTimers();          // 作废上一关遗留的延时任务（finish / 复读 / 切题）
  S.lvToken++;              // 关卡令牌换代

  S.combo=0; S.comboT=0; S.winT=0; S.fireT=0;

  var br=Math.max(38,Math.min(58,W*0.055));

  var by=Math.max(ARENA.y0+br+14, Math.min(ARENA.y1-br-14, ARENA.y1-90));

  S.bh={x:bx, y:by0, r:br, rBase:br, growT:0, flash:0,

    var extra=['b','m','h','sh','g','a','i','u','ao'];
    var smL=Object.keys(sms), ymL=Object.keys(yms);

    ['o','e','ang'].forEach(function(x){ if(ymL.indexOf(x)<0 && ymL.length<8) ymL.push(x); });

  document.getElementById('winMask').classList.add('hide');
  updateTop(); updateGoal();
  toast(S.level.tip, 3.4);
  S.hint = S.level.tip;
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
/* 认读/识字关卡片越吃越少后，把剩下的重新散开铺满场地（避免全挤在角落不好找） */
function respread(){
  var alive=S.planets.filter(function(p){ return p.st==='alive'; });
  if(alive.length<2) return;
  var gap=Math.max(72, alive[0].r*2.6);
  alive.forEach(function(p,i){
    var tries=0, okp=false, nx=p.x, ny=p.y;
    while(!okp && tries++<240){
      nx=ARENA.x0+p.r+Math.random()*Math.max(1,(ARENA.x1-ARENA.x0-p.r*2));
      ny=ARENA.y0+p.r+Math.random()*Math.max(1,(ARENA.y1-ARENA.y0-p.r*2));
      okp=clearOfBH({x:nx,y:ny,r:p.r});
      if(okp){
        /* 参照必须是「已放置卡的目标点」：本函数只写 tx/ty，卡的 x/y 仍是旧位置。
           拿旧位置当参照会让目标点彼此挨得很近（实测最小间距低至 22px，而卡片半径 46
           → 两张卡几乎完全重叠，孩子既看不清也点不到）。 */
        var jx, jy;
        // 后期逐步放宽间距要求，兜底档至少保证「不重叠」（宁可近一点也不让卡片叠在一起）
        var need = tries<120 ? gap : (tries<200 ? gap*0.72 : p.r*2.08);
        for(var j=0;j<i && okp;j++){
          jx=(alive[j].tx!==undefined)?alive[j].tx:alive[j].x;
          jy=(alive[j].ty!==undefined)?alive[j].ty:alive[j].y;
          if(Math.hypot(jx-nx, jy-ny)<need) okp=false;
        }
      }
    }
    // 平滑换位：只记录目标点，由 drawPlanet 的 lerp 滑过去（「交换效果」），不再瞬移
    p.tx=nx; p.ty=ny; p.vx=0; p.vy=0;
  });
}

function updateTop(){
  document.getElementById('lvName').textContent = '第'+(S.li+1)+'关 · '+S.level.name;
  var dk=diffOn();
  document.getElementById('lvSub').textContent =
    (S.level.type==='zi' ? '看图识字 · 吃掉全部汉字' :
    S.level.type==='free' ? '自由认读 · 吃掉全部拼音' : '拼读任务 · 声母→韵母→声调')
    + '　' + dk.emo + dk.name;
  document.getElementById('stars').textContent = '⭐ '+S.prog.stars;
}
function updateGoal(){
  var L=document.getElementById('goalLeft'), T=document.getElementById('goalText');
  L.innerHTML=''; 
  if(!S.level){ T.textContent=''; return; }
  if(S.level.type==='free' || S.level.type==='zi'){
    var total=S.level.set.length, done=Object.keys(S.eaten).length;
    T.innerHTML = S.level.type==='zi'
      ? '还剩 <b>'+(total-done)+'</b> 个汉字没认到'
      : '还剩 <b>'+(total-done)+'</b> 颗拼音星球没被吃掉';
    return;
  }
  var t=S.level.tasks[S.ti];
  if(!t){ T.innerHTML='<b>全部完成！</b>'; return; }
  var parts=[
    {v: S.step>=1 ? t.sm : '', sub:'声母', on:S.step===0},
    {v: S.step>=2 ? t.ym : '', sub:'韵母', on:S.step===1},
    {v: S.step>=3 ? markTone(t.sm+t.ym, t.t) : '', sub:'声调', on:S.step===2}
  ];
  parts.forEach(function(p,i){
    if(i) { var ar=document.createElement('div'); ar.className='arrow'; ar.textContent='+'; L.appendChild(ar); }
    var d=document.createElement('div');
    d.className='slot'+(p.v?' fill':'')+(p.on?' wait':'');
    d.innerHTML=(p.v?p.v:'?')+'<small>'+p.sub+'</small>';
    L.appendChild(d);
  });
  var ar2=document.createElement('div'); ar2.className='arrow'; ar2.textContent='='; L.appendChild(ar2);
  var d2=document.createElement('div');
  d2.className='slot'+(S.step>=3?' fill':'');
  d2.innerHTML=(S.step>=3? ('<span style="font-size:26px">'+t.em+'</span>') : '?')+'<small>'+(S.step>=3?t.zi:'汉字')+'</small>';
  L.appendChild(d2);
  T.innerHTML = '拼出：<b>'+markTone(t.sm+t.ym,t.t)+'</b>　'+t.em+' '+t.zi;
}

function toast(msg, sec){ S.hint=msg; S.hintT=sec||2.2; }

/* ---------- 9. 交互 ---------- */
function pos(e){ var r=cv.getBoundingClientRect(); var p=(e.touches&&e.touches[0]?e.touches[0]:e); return {x:p.clientX-r.left, y:p.clientY-r.top}; }
function hit(px,py){
  var best=null, bd=1e9;
  for(var i=S.planets.length-1;i>=0;i--){ var p=S.planets[i];
    if(p.st!=='alive') continue;
    if(p.in!==undefined && p.in<0.9) continue;   // 还在弹入动画中（画面上看不见）→ 不可点
    var d=Math.hypot(p.x-px,p.y-py), lim=Math.max(p.r+16,34);
    if(d<=lim && d<bd){ bd=d; best=p; } }
  return best;
}
function safeSfx(fn){ try{ if(typeof fn==='function') fn(); }catch(err){} }
function onDown(e){
  if(S.scene!=='play') return;
  // 新手引导：任意点击即「学会」并消失（首次点击顺带正常吞噬，边做边学）
  if(S.tut){ S.tut=0; if(!S.prog.seenTut){ S.prog.seenTut=true; saveProg(); } }
  var now=Date.now(); if(now-lastDown<110) return; lastDown=now;
  // 音频异常绝不能打断命中判定（微信里 AudioContext 可能直接抛错）
  safeSfx(function(){ Sfx.ac(); });
  safeSfx(function(){ Sound.unlock(); });
  if(e.cancelable){ try{ e.preventDefault(); }catch(err){} }
  var m=pos(e), p=hit(m.x,m.y), b=S.bh;
  var bhLim=Math.max(b.r+20, 44);
  if(Math.hypot(b.x-m.x,b.y-m.y) < bhLim){ b.drag=true; b.tgt=null; b.tx=m.x; b.ty=m.y; safeSfx(Sfx.click); return; }
  if(p){ b.tgt=p; b.drag=false; p.pop=1; safeSfx(Sfx.click); }
  else { b.tgt=null; b.drag=false; b.tx=m.x; b.ty=m.y; safeSfx(Sfx.click); }
}
function onMove(e){
  if(S.scene!=='play' || !S.bh || !S.bh.drag) return;
  var m=pos(e); S.bh.tx=m.x; S.bh.ty=m.y;
}
function onUp(){ if(S.bh) S.bh.drag=false; }
var lastDown=0;
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
// 兜底：老内核 / 微信 X5 不一定派发 pointer 事件
cv.addEventListener('touchstart', onDown, {passive:false});
cv.addEventListener('touchmove', onMove, {passive:false});
cv.addEventListener('touchend', onUp);
cv.addEventListener('touchcancel', onUp);
cv.addEventListener('mousedown', onDown);
cv.addEventListener('mousemove', onMove);
cv.addEventListener('mouseup', onUp);

/* ---------- 10. 吞噬结算 ---------- */
/* 吃掉一张卡片 → 黑洞长大一点 + 内核闪一下（视觉上「吃得越多、越强」） */
function feedBH(n){
  var b=S.bh; if(!b) return;
  if(b.growT===undefined) b.growT=0;
  b.growT=Math.min(0.5, b.growT+(n||0.04));
  b.flash=1;                       // 触发内核闪白 + 视界环外扩
}
function onEaten(p){
  Sfx.swallow();
  var pen=diffOn().pen;   // 难度档 → 点错/退场惩罚时长倍数
  S.flash=Math.min(1, S.flash+0.35);
  burst(p.x,p.y,p.kind==='tone'?'#ffd166':(p.kind==='sm'?'#6ea8ff':'#4dd4ac'));
  if(S.level.type==='free'){
    Sound.say(p.say, akey(p.id)); Sound.assertVoice(p.say, 0.86);
    S.eaten[p.id]=1; S.prog.known[p.id]=1;
    feedBH(0.05);
    S.bh.label=p.py; S.bh.labelT=1.4;
    S.prog.stars++; saveProg(); updateTop(); updateGoal();   // 合并成一次落盘（localStorage 是同步阻塞 API）
    cheerPop(p.x,p.y);
    var left=S.level.set.length-Object.keys(S.eaten).length;
    if(left<=0) lvLater(finish, 900);
    else if(left===3 || left===1) respread();
    if(left<=3) toast('就剩 '+left+' 个啦！', 1.8);
  }else if(S.level.type==='zi'){
    // 识字关：点哪个字就读哪个字，读完一个少一个（TTS 出声，失败自动在线合成）
    Sound.say(p.say, p.id); Sound.assertVoice(p.say, 0.86);
    S.eaten[p.id]=1; S.prog.known[p.id]=1;
    feedBH(0.055);
    S.bh.label=p.py; S.bh.labelT=1.6;
    S.prog.stars++; saveProg(); updateTop(); updateGoal();   // 合并成一次落盘
    cheerPop(p.x,p.y);
    var zleft=S.level.set.length-Object.keys(S.eaten).length;
    if(zleft<=0) lvLater(finish, 900);
    else if(zleft===3 || zleft===1) respread();     // 剩得少时重新散开，别挤成一堆
    if(zleft<=3) toast('就剩 '+zleft+' 个字啦！', 1.8);
  }else{
    var t=S.level.tasks[S.ti];
    if(!t) return;
    if(p.kind==='tone'){
      if(S.step<2){ toast('要先吃掉声母和韵母哦', 1.8); Sfx.nope(); p.respawn=0.9*pen; return; }
      if(p.tone===t.t){
        S.step=3; S.got=markTone(t.sm+t.ym,t.t);
        Sound.say(t.zi, akey(t.sm+t.ym+t.t)); Sound.assertVoice(t.zi, 0.86);
        lvLater(function(){ Sound.say(t.zi, akey(t.sm+t.ym+t.t)); }, 1500);
        feedBH(0.06);
        S.bh.label=S.got; S.bh.labelT=2.2; S.bh.burst=1;
        S.prog.stars++; S.prog.known[t.sm]=1; S.prog.known[t.ym]=1; saveProg(); updateTop();
        Sfx.win(); bigBurst(t); cheerPop(S.bh.x, S.bh.y-S.bh.r);
        updateGoal();
        lvLater(function(){
          S.ti++; S.step=0; S.got=''; S.bh.label=''; S.bh.labelT=0;
          if(S.ti>=S.level.tasks.length){ finish(); } else { updateGoal(); toast('下一个：'+markTone(S.level.tasks[S.ti].sm+S.level.tasks[S.ti].ym,S.level.tasks[S.ti].t), 2); }
        }, 2300);
      }else{
        toast('这是'+p.name+'，我们要找的是'+TONE_DEMO[t.t-1].name+'哦', 2.4);
        Sound.say(p.say, 't'+p.tone); Sound.assertVoice(p.say, 0.86);
        Sfx.nope(); p.respawn=0.9*pen; S.shakeT=0.25;
        p.err=1; floatText(p.x, p.y, '再想想', '#ff8a3d', 1.2);   // 错卡红框抖动 + 飘字
        var pc=S.combo; S.combo=0;
        if(pc>=3) floatText(S.bh.x, S.bh.y-S.bh.r-22, '连击断了，继续！', '#ff9aa2', 1.3);
        bumpErr(p.id);
      }
      return;
    }
    // 声母 / 韵母
    var need = (S.step===0)? t.sm : t.ym;
    if(p.id===need){
      Sound.say(p.say, akey(p.id)); Sound.assertVoice(p.say, 0.86);
      feedBH(0.04);
      S.bh.label = (S.step===0? t.sm : t.sm+t.ym); S.bh.labelT=1.6;
      S.step++; S.got=S.bh.label; cheerPop(p.x,p.y);
      updateGoal();
      toast(S.step===1? ('声母 '+t.sm+' 吃到啦！再找韵母 '+t.ym) : ('韵母 '+t.ym+' 也吃到啦！现在选声调'), 2.4);
      p.respawn=1.4*pen;
    }else{
      Sound.say(p.say, akey(p.id)); Sound.assertVoice(p.say, 0.86);
      var want = (S.step===0)? ('声母 '+t.sm) : ('韵母 '+t.ym);
      toast('这个读“'+p.say+'”，不是我们要的'+want+'，再找找～', 2.6);
      Sfx.nope(); p.respawn=1.4*pen;
      p.err=1; floatText(p.x, p.y, '再想想', '#ff8a3d', 1.2);
      var pc=S.combo; S.combo=0;
      if(pc>=3) floatText(S.bh.x, S.bh.y-S.bh.r-22, '连击断了，继续！', '#ff9aa2', 1.3);
      bumpErr(p.id);
    }
  }
}

function burst(x,y,color){
  for(var i=0;i<16;i++){
    var a=Math.random()*Math.PI*2, s=40+Math.random()*140;
    S.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5+Math.random()*0.5,
      t:0,c:color,sz:2+Math.random()*3});
  }
}
function bigBurst(t){
  var cols=['#ffd166','#ff8a3d','#6ea8ff','#4dd4ac','#ff6b9d'];
  for(var i=0;i<70;i++){
    var a=Math.random()*Math.PI*2, s=60+Math.random()*320;
    S.parts.push({x:S.bh.x,y:S.bh.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.8+Math.random()*0.9,
      t:0,c:cols[(Math.random()*cols.length)|0],sz:2+Math.random()*4});
  }
}

/* 上浮飘字 + 连击鼓励（2026-10-07）
   孩子答对后画面要有「我做到了」的即时回响：卡片位置飘出 ⭐+1，
   连续答对升级成「真棒 ×N / 好棒 ×N / 太厉害了 ×N」并追加粒子。*/
function floatText(x,y,txt,col,sec){
  S.floats.push({x:x,y:y,txt:txt,c:col||'#ffd166',t:0,life:sec||1.1});
}
function cheerPop(x,y){
  S.combo++; S.comboT=2.6;
  if(S.combo>=6)      floatText(x,y,'太厉害了 ×'+S.combo,'#ff8fd0',1.5);
  else if(S.combo>=4) floatText(x,y,'好棒 ×'+S.combo,'#7ef7c8',1.3);
  else if(S.combo>=2) floatText(x,y,'真棒 ×'+S.combo,'#a8e6ff',1.2);
  else                floatText(x,y,'⭐ +1','#ffd166',1.1);
  if(S.combo>=4) burst(x,y,'#ffd166');
}

// 拼读一步完成：发汉字音 → 星星 → 特效 → 进下一个 / 通关
function spellDone(t){
  var key=akey(t.sm+t.ym+t.t);
  S.step=3; S.got=markTone(t.sm+t.ym,t.t);
  Sound.say(t.zi, key);
  lvLater(function(){ Sound.say(t.zi, key); }, 1500);
  feedBH(0.06);
  S.bh.label=t.zi; S.bh.labelT=2.2; S.bh.burst=1;
  S.prog.stars++; S.prog.known[t.sm]=1; S.prog.known[t.ym]=1; saveProg(); updateTop();
  Sfx.win(); bigBurst(t);
  updateGoal();
  lvLater(function(){
    S.ti++; S.step=0; S.got=''; S.bh.label=''; S.bh.labelT=0;
    if(S.ti>=S.level.tasks.length){ finish(); }
    else { updateGoal(); toast('下一个：'+markTone(S.level.tasks[S.ti].sm+S.level.tasks[S.ti].ym,S.level.tasks[S.ti].t), 2); }
  }, 2300);
}

function finish(){
  // 防御：已在别的场景（玩别的关 / 已通关）就不重复弹窗，避免旧延时任务覆盖当前局
  if(S.scene!=='play') return;
  S.scene='win';
  document.getElementById('btnRedo').style.display='none';
  S.winT=3.6; S.combo=0; bigBurst();   // 弹窗背后持续放烟花
  if(!S.level.tmp) S.prog.passed[S.li]=1;   // 临时复习关不冒充正式关卡的通关记录
  if(!S.level.tmp && S.li+1<LEVELS.length && !S.prog.passed[S.li+1]) justUnlocked=S.li+1;   // 触发下一关解锁过场
  saveProg();
  var em = S.level.type==='zi' ? '📖' : (S.level.type==='free'?'🌟':'🏆');
  document.getElementById('winEmoji').textContent=em;
  document.getElementById('winTitle').textContent = '第'+(S.li+1)+'关 通关！';
  document.getElementById('winDesc').innerHTML =
    S.level.name+' —— 太厉害了！<br>累计 ⭐ '+S.prog.stars+' 颗星星';
  document.getElementById('btnNext').style.display = (!S.level.tmp && S.li<LEVELS.length-1)?'':'none';
  document.getElementById('winMask').classList.remove('hide');
  Sfx.win();
}

/* ---------- 11. 主循环 ---------- */
var last=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts;
  draw(dt);
  requestAnimationFrame(loop);
}
function draw(dt){
  var g=ctx;
  g.clearRect(0,0,W,H);
  // 背景
  var bg=g.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#070a1c'); bg.addColorStop(0.5,'#0a0d24'); bg.addColorStop(1,'#05060f');
  g.fillStyle=bg; g.fillRect(0,0,W,H);

  if(S.scene==='start'){ drawStartBg(dt); return; }

  var b=S.bh;
  if(S.shakeT>0){ S.shakeT-=dt; g.save(); g.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6); }
  else g.save();

  // 星空（受黑洞引力）
  S.bgStars.forEach(function(s){
    var dx=b.x-s.x, dy=b.y-s.y, d=Math.hypot(dx,dy)||1;
    if(d<260){ var f=(1-d/260)*110*dt; s.x+=dx/d*f*s.z; s.y+=dy/d*f*s.z; }
    s.x += (0.6+s.z*0.6)*dt*6;
    if(s.x>W+4) s.x=-4;
    if(d < b.r*0.5){ s.x=Math.random()*W; s.y=Math.random()*H; }
    g.globalAlpha=s.a*(0.5+s.z*0.5);
    g.fillStyle='#cfe0ff'; g.beginPath(); g.arc(s.x,s.y,s.r,0,6.283); g.fill();
  });
  g.globalAlpha=1;

  // 星球（存活）
  S.planets.forEach(function(p){ if(p.st==='alive') drawPlanet(g,p,dt); });
  // 黑洞
  drawBH(g,b,dt);
  // 被捕获的星球
  S.planets.forEach(function(p){ if(p.st==='capturing') drawCapture(g,p,dt,b); });
  // 粒子：原地剔除（不 filter 重建数组）—— 每帧新建数组在 iPad 60fps 下是纯浪费
  var ps=S.parts, w=0;
  for(var pi=0; pi<ps.length; pi++){
    var q=ps[pi];
    q.t+=dt;
    if(q.t>=q.life) continue;             // 过期就地丢弃
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.965; q.vy*=0.965;
    ps[w++]=q;
    g.globalAlpha=Math.max(0,1-q.t/q.life);
    g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,q.sz,0,6.283); g.fill();
  }
  ps.length=w;
  g.globalAlpha=1;

  // 上浮飘字（⭐+1 / 连击鼓励）
  var fl=S.floats, fw=0;
  for(var fi=0; fi<fl.length; fi++){
    var f=fl[fi]; f.t+=dt;
    if(f.t>=f.life) continue;
    fl[fw++]=f;
    var fk=f.t/f.life;
    g.globalAlpha=Math.max(0,1-fk*fk);
    g.font='800 '+Math.max(15,Math.min(26,W*0.042))+'px "PingFang SC","Microsoft YaHei",sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.lineWidth=4; g.strokeStyle='rgba(6,10,26,.85)';
    g.strokeText(f.txt, f.x, f.y-fk*56);
    g.fillStyle=f.c; g.fillText(f.txt, f.x, f.y-fk*56);
  }
  fl.length=fw;
  g.globalAlpha=1;

  // 连击计时窗口（2.6s 内没再答对就断）
  if(S.comboT>0){ S.comboT-=dt; if(S.comboT<=0) S.combo=0; }
  // 通关烟花：弹窗背后持续放，给孩子一个「我赢了」的实感
  if(S.winT>0){
    S.winT-=dt; S.fireT=(S.fireT||0)-dt;
    if(S.fireT<=0){
      S.fireT=0.32;
      var fx=W*(0.12+Math.random()*0.76), fy=H*(0.18+Math.random()*0.5);
      var fc=['#ffd166','#ff8a3d','#6ea8ff','#4dd4ac','#ff6b9d'];
      for(var fi2=0; fi2<26; fi2++){
        var fa=Math.random()*6.283, fsp=50+Math.random()*230;
        S.parts.push({x:fx,y:fy,vx:Math.cos(fa)*fsp,vy:Math.sin(fa)*fsp,
          life:0.7+Math.random()*0.8, t:0, c:fc[(Math.random()*5)|0], sz:2+Math.random()*3});
      }
    }
  }

  // 屏幕闪光
  if(S.flash>0){ S.flash-=dt*2.2; g.fillStyle='rgba(255,220,160,'+Math.max(0,S.flash*0.12)+')'; g.fillRect(0,0,W,H); }

  g.restore();

  // 顶部提示条（窄屏自动换行，最多两行）；教程演示期间冻结 tip，避免两条提示叠在一起
  if(S.hintT>0 && !S.tut){
    S.hintT-=dt;
    g.globalAlpha=Math.min(1,S.hintT*2);
    g.font='600 '+Math.max(14,Math.min(20,W*0.032))+'px "PingFang SC","Microsoft YaHei",sans-serif';
    var maxW=W-28, lines=wrapText(g,S.hint,maxW), lh=22;
    var ty=(document.getElementById('topbar').offsetHeight||64)+12;
    var bw=Math.max.apply(null,lines.map(function(s){return g.measureText(s).width;}))+36;
    var bh=lines.length*lh+16;
    g.fillStyle='rgba(8,12,32,.82)';
    roundRect(g,W/2-bw/2,ty,bw,bh,14); g.fill();
    g.fillStyle='#ffe9b0'; g.textAlign='center'; g.textBaseline='middle';
    lines.forEach(function(s,i){ g.fillText(s, W/2, ty+8+lh/2+i*lh); });
    g.globalAlpha=1;
  }

  // 新手引导演示：首次进入播放「点一下卡片→黑洞飞过去吃掉」
  if(S.tut){
    S.tutT += dt;
    if(S.tutT>9){ S.tut=0; if(!S.prog.seenTut){ S.prog.seenTut=true; saveProg(); } }
    else drawTutorial(g);
  }
}

// 新手引导：高亮一张卡片 + 手指点击动画 + 顶部说明（点任意处即消失并学会）
function drawTutorial(g){
  var tc=null;
  for(var i=0;i<S.planets.length;i++){ if(S.planets[i].st==='alive'){ tc=S.planets[i]; break; } }

  var tap = (Math.sin(S.tutT*3.4)>0) ? 0 : 1;        // 0=抬起到位 1=按下

  g.fillStyle='#fff'; g.fill(); g.stroke();
  g.restore();
  // 指向卡片的小箭头
  g.fillStyle='rgba(255,221,102,.9)';
  g.beginPath(); g.moveTo(fx-7, fy+34); g.lineTo(fx+7, fy+34); g.lineTo(fx, fy+46); g.closePath(); g.fill();
  // 顶部说明条（窄屏自动换行，最多两行）

  var lines=wrapText(g,msg,W-48), lh=Math.max(18,Math.min(24,W*0.026));
  var bw=Math.max.apply(null,lines.map(function(s){return g.measureText(s).width;}))+36;
  var bh=lines.length*lh+14;
  var ty=(document.getElementById('topbar').offsetHeight||64)+12;
  g.fillStyle='rgba(8,12,32,.9)'; roundRect(g,W/2-bw/2,ty,bw,bh,14); g.fill();
  g.fillStyle='#ffe9b0'; g.textAlign='center'; g.textBaseline='middle';
  lines.forEach(function(s,i){ g.fillText(s, W/2, ty+7+lh/2+i*lh); });
}

function wrapText(g,txt,maxW){
  txt=String(txt||'');
  if(g.measureText(txt).width<=maxW) return [txt];
  var best=1, bd=1e9;
  for(var i=1;i<txt.length;i++){
    var w=g.measureText(txt.slice(0,i)).width;
    var d=Math.abs(w-maxW/2);
    if(w<=maxW && d<bd){ bd=d; best=i; }
  }
  return [txt.slice(0,best), txt.slice(best)];
}

/* ---------- 6.5 星球外形：几何 / 房子 / 汽车 / 树 / 云 ---------- */
function rrPath(g,x,y,w,h,rad){
  rad=Math.min(rad, w/2, h/2);
  g.moveTo(x+rad,y); g.lineTo(x+w-rad,y); g.quadraticCurveTo(x+w,y,x+w,y+rad);
  g.lineTo(x+w,y+h-rad); g.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);
  g.lineTo(x+rad,y+h); g.quadraticCurveTo(x,y+h,x,y+h-rad);
  g.lineTo(x,y+rad); g.quadraticCurveTo(x,y,x+rad,y); g.closePath();
}
function poly(g,pts,close){
  g.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]);
  if(close!==false) g.closePath();
}
/* 以 (0,0) 为中心生成外形路径，r 为外接半径 */
function shapePath(g, shape, r){
  g.beginPath();
  var i, a;
  switch(shape){
    case 'square':
      rrPath(g, -r*0.84, -r*0.84, r*1.68, r*1.68, r*0.3); break;
    case 'tri':
      poly(g, [[0,-r*0.98],[r*0.9,r*0.72],[-r*0.9,r*0.72]]); break;
    case 'diamond':
      poly(g, [[0,-r],[r*0.94,0],[0,r],[-r*0.94,0]]); break;
    case 'hex':
      for(i=0;i<6;i++){ a=-Math.PI/2+i*Math.PI/3;
        var px=Math.cos(a)*r, py=Math.sin(a)*r;
        if(i===0) g.moveTo(px,py); else g.lineTo(px,py); }
      g.closePath(); break;
    case 'star':
      for(i=0;i<10;i++){ a=-Math.PI/2+i*Math.PI/5;
        var rr=(i%2===0)?r:r*0.47;
        var sx=Math.cos(a)*rr, sy=Math.sin(a)*rr;
        if(i===0) g.moveTo(sx,sy); else g.lineTo(sx,sy); }
      g.closePath(); break;
    case 'house':
      poly(g, [[0,-r],[r*0.92,-r*0.3],[r*0.92,r*0.86],[-r*0.92,r*0.86],[-r*0.92,-r*0.3]]); break;
    case 'car':
      poly(g, [[-r*0.95,r*0.3],[-r*0.95,r*0.86],[r*0.95,r*0.86],[r*0.95,r*0.3],
               [r*0.6,r*0.3],[r*0.36,-r*0.42],[-r*0.36,-r*0.42],[-r*0.6,r*0.3]]); break;
    case 'rocket':
      poly(g, [[0,-r],[-r*0.42,-r*0.1],[-r*0.62,r*0.42],[-r*0.62,r*0.86],
               [r*0.62,r*0.86],[r*0.62,r*0.42],[r*0.42,-r*0.1]]); break;
    case 'tree':
      rrPath(g, -r*0.24, -r*0.1, r*0.48, r*1.0, r*0.14);
      rrPath(g, -r*0.62, -r*0.98, r*1.24, r*1.0, r*0.36); break;
    case 'cloud':
      g.arc(-r*0.42, r*0.16, r*0.44, 0, 6.283);
      g.arc(r*0.1, -r*0.24, r*0.56, 0, 6.283);
      g.arc(r*0.48, r*0.2, r*0.4, 0, 6.283);
      g.closePath(); break;
    case 'heart':
      g.moveTo(0, r*0.86);
      g.bezierCurveTo(-r*1.35,-r*0.1, -r*0.62,-r*1.05, 0,-r*0.36);
      g.bezierCurveTo(r*0.62,-r*1.05, r*1.35,-r*0.1, 0, r*0.86);
      g.closePath(); break;
    default:
      g.arc(0,0,r,0,6.283);
  }
}
/* 外形内部可写字区域的比例（窄 shape 字要缩一缩，才不会溢出） */
function shapeTextScale(shape){
  return shape==='tri' ? 0.62 : shape==='star' ? 0.58 : shape==='car' ? 0.6
       : shape==='rocket' ? 0.58 : shape==='heart' ? 0.6 : shape==='house' ? 0.68
       : shape==='tree' ? 0.66 : shape==='cloud' ? 0.7 : shape==='diamond' ? 0.72
       : shape==='square' ? 0.86 : shape==='hex' ? 0.9 : 1;
}
function shapeBound(shape, r){ return shape==='square' ? r*0.88 : r; }
/* 外形里的小零件：房子门窗 / 汽车轮子 / 树干 / 云纹… */
function drawShapeDeco(g, shape, r){
  g.fillStyle='rgba(35,16,86,.3)';
  if(shape==='house'){
    g.fillRect(-r*0.34, r*0.3, r*0.68, r*0.56);
    g.fillRect(-r*0.66, -r*0.12, r*0.3, r*0.34);
    g.fillRect(r*0.36, -r*0.12, r*0.3, r*0.34);
  }else if(shape==='car'){
    g.beginPath(); g.arc(-r*0.5, r*0.9, r*0.24, 0, 6.283); g.fill();
    g.beginPath(); g.arc(r*0.5, r*0.9, r*0.24, 0, 6.283); g.fill();
  }else if(shape==='tree'){
    g.fillRect(-r*0.14, r*0.4, r*0.28, r*0.5);
  }else if(shape==='rocket'){
    g.fillRect(-r*0.52, r*0.5, r*0.28, r*0.36);
    g.fillRect(r*0.24, r*0.5, r*0.28, r*0.36);
  }else if(shape==='cloud'){
    g.fillRect(-r*0.8, r*0.2, r*1.6, r*0.34);
  }else if(shape==='star' || shape==='hex' || shape==='diamond' || shape==='square'){
    g.beginPath(); g.arc(0, r*0.34, Math.max(2, r*0.12), 0, 6.283); g.fill();
  }
}

function anyCapturing(){ // 同一时刻只允许吃一张卡：避免「移动黑洞顺手吞一串」与被动漂移误吞
  for(var i=0;i<S.planets.length;i++){ if(S.planets[i].st==='capturing') return true; }
  return false;
}
function drawPlanet(g,p,dt){
  if(p.kind==='tone'){ drawToneBall(g,p,dt); return; }
  p.spin+=dt*0.4;
  // 重生倒计时
  if(p.respawn>0){
    p.respawn-=dt;
    if(p.respawn>0) return;          // 仍在倒计时 → 这一帧不绘制
    p.st='alive'; p.cap=0; p.in=0; p.inD=0;
    var tries=0, ok=false;
      while(!ok && tries++<120){
        p.x=ARENA.x0+p.r+Math.random()*(ARENA.x1-ARENA.x0-p.r*2);
        p.y=ARENA.y0+p.r+Math.random()*(ARENA.y1-ARENA.y0-p.r*2);
        ok=clearOfBH(p);
        for(var j=0;j<S.planets.length && ok;j++){ var q=S.planets[j];
          if(q!==p && q.st==='alive' && Math.hypot(q.x-p.x,q.y-p.y)<p.r*2.3){ ok=false; } }
      }
  }
  // 入场：开局错峰弹入 / 重生后弹入（easeOutBack），避免卡片「凭空出现」
  var inS=1;
  if(p.inD>0){ p.inD-=dt; return; }
  if(p.in<1){
    p.in=Math.min(1, p.in+dt*3.4);
    var e=p.in; inS=1+2.7*Math.pow(e-1,3)+1.7*Math.pow(e-1,2);
    if(inS<0.02) return;
  }
  // 平滑换位（respread 给的 tx/ty）：滑到位前不走漂移；到位后恢复轻轻漂移
  if(p.tx!==undefined){
    var LK=Math.min(1,dt*5.5);
    p.x+=(p.tx-p.x)*LK; p.y+=(p.ty-p.y)*LK;
    if(Math.abs(p.tx-p.x)<0.6 && Math.abs(p.ty-p.y)<0.6){
      p.x=p.tx; p.y=p.ty; p.tx=undefined; p.ty=undefined;
      p.vx=(Math.random()-0.5)*12; p.vy=(Math.random()-0.5)*12;
    }
  } else {
    // 漂移
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<ARENA.x0+p.r){ p.x=ARENA.x0+p.r; p.vx=Math.abs(p.vx); }
    if(p.x>ARENA.x1-p.r){ p.x=ARENA.x1-p.r; p.vx=-Math.abs(p.vx); }
    if(p.y<ARENA.y0+p.r){ p.y=ARENA.y0+p.r; p.vy=Math.abs(p.vy); }
    if(p.y>ARENA.y1-p.r){ p.y=ARENA.y1-p.r; p.vy=-Math.abs(p.vy); }
  }
  // 与黑洞距离过近时轻微逃离：仅作视觉点缀。但「拖拽黑洞去吃这张卡」时绝不能推它，
  // 否则卡片一边逃一边吃不到（用户反馈：移动黑洞压到汉字却吃不到）。目标卡同样不逃。
  var b=S.bh, d=Math.hypot(b.x-p.x,b.y-p.y);
  var isTarget = (b.tgt===p);
  var dragging = !!b.drag;
  var growK = (b.rBase? b.r/b.rBase : 1);
  if(d < b.r+p.r+46 && !isTarget && !dragging){
    var f=(1-d/(b.r+p.r+46))*36*dt*growK;
    p.x += (p.x-b.x)/(d||1)*f; p.y += (p.y-b.y)/(d||1)*f;
  }
  // 硬约束：漂移 / 逃逸 / 平滑换位之后，星球中心必须留在可视场地内。
  // 否则逃逸会把卡片推到顶栏背后或画面外「一直回不来」，黑洞也吃不到（修复漂移出界）。
  p.x=Math.max(ARENA.x0+p.r, Math.min(ARENA.x1-p.r, p.x));
  p.y=Math.max(ARENA.y0+p.r, Math.min(ARENA.y1-p.r, p.y));
  // 目标高亮
  var needGlow=false;
  if(S.level && S.level.type==='spell' && S.hintOn && diffOn().hint){
    var t=S.level.tasks[S.ti]; if(t){
      if(S.step===0 && p.id===t.sm) needGlow=true;
      if(S.step===1 && p.id===t.ym) needGlow=true;
      if(S.step===2 && p.kind==='tone' && p.tone===t.t) needGlow=true;
    }
  }
  p.glow += ((needGlow||isTarget?1:0) - p.glow)*Math.min(1,dt*8);

  var col = (p.kind==='zi') ? [p.c1, p.c2]           // 识字：每字一色
          : p.kind==='sm' ? ['#7fb0ff','#3f6bd6']
          : p.kind==='ym' ? ['#6ce3bb','#1f9c7c']
          : ['#ffd98a','#e09b2d'];
  if(p.pop>0) p.pop=Math.max(0, p.pop-dt*4);
  if(p.err>0) p.err=Math.max(0, p.err-dt*1.6);   // 点错后的红框脉冲衰减
  var sh = p.err>0 ? Math.sin(performance.now()/26)*p.err*7 : 0;  // 点错后局部抖动
  var pup = 1 + Math.sin(performance.now()/300)*0.03 + p.glow*0.09 + (p.pop||0)*0.16;
  var r=p.r*pup*inS;

  g.save(); g.translate(p.x+sh,p.y+sh*0.6);
  if(p.glow>0.02){
    g.globalAlpha=0.25+p.glow*0.5;
    var hg=g.createRadialGradient(0,0,r*0.6,0,0,r*2.1);
    hg.addColorStop(0, col[0]); hg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=hg; g.beginPath(); g.arc(0,0,r*2.1,0,6.283); g.fill();
    g.globalAlpha=1;
  }
  // 球体（识字星球是 Houses / Cars / 树 / 云 等几何外形，拼音仍是圆球）
  var hr = (p.kind==='zi') ? shapeBound(p.shape, r) : r;
  g.save();
  shapePath(g, p.kind==='zi'?p.shape:'circle', hr);
  var gr=g.createRadialGradient(-hr*0.32,-hr*0.36,hr*0.12,0,0,hr*1.05);
  gr.addColorStop(0,col[0]); gr.addColorStop(1,col[1]);
  g.fillStyle=gr; g.fill();
  // 外形内部的“小零件”：房子有门窗、汽车有轮子、树有树干
  g.save();
  shapePath(g, p.kind==='zi'?p.shape:'circle', hr);
  g.clip();
  if(p.kind==='zi') drawShapeDeco(g, p.shape, hr);
  g.restore();
  g.lineWidth=2; g.strokeStyle='rgba(255,255,255,'+(0.3+p.glow*0.5)+')';
  g.stroke();
  // 点错反馈：橙红描边脉冲（仅拼读关点错时 p.err 被置 1）
  if(p.err>0){
    g.lineWidth=3+3*p.err; g.strokeStyle='rgba(255,90,60,'+(0.85*p.err)+')';
    g.beginPath(); g.arc(0,0,hr+4,0,6.283); g.stroke();
  }
  g.restore();
  // 拼音 / 声调
  g.textAlign='center'; g.textBaseline='middle';
  if(p.kind==='tone'){
    g.fillStyle='#3a2600';
    g.font='700 '+(r*1.0)+'px "Segoe UI",Arial,sans-serif';
    g.fillText(p.mark, 0, -r*0.12);
    g.font='600 '+(r*0.32)+'px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(p.name, 0, r*0.52);
  }else if(p.kind==='zi'){
    // 识字星球：外形（房子/汽车/树/云…）+ 图示 emoji + 大汉字 + 小拼音
    var k=shapeTextScale(p.shape);
    if(p.em){
      g.font=(r*0.6*k)+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      g.fillText(p.em, 0, -r*k*0.66);
    }
    g.font='800 '+(r*0.78*k)+'px "PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
    g.lineWidth=Math.max(2,r*0.1); g.strokeStyle='rgba(255,255,255,.85)';
    g.strokeText(p.zi||p.py, 0, -r*k*0.02);
    g.fillStyle='#231056';
    g.fillText(p.zi||p.py, 0, -r*k*0.02);
    g.font='700 '+(r*0.27*k)+'px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle='rgba(35,16,86,.8)';
    g.fillText(p.py, 0, r*k*0.46);
  }else{
    g.fillStyle='#0c1330';
    g.font='800 '+(r*0.72)+'px "Segoe UI",Arial,"Times New Roman",sans-serif';
    g.fillText(p.py, 0, S.showZi? -r*0.12 : 0);
    if(S.showZi){
      g.font='600 '+(r*0.34)+'px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillStyle='rgba(12,19,48,.72)';
      g.fillText(p.say, 0, r*0.5);
    }
  }
  g.restore();

  // 接触即捕获：两种入口都成立 —— (a) 玩家点中的目标卡（黑洞飞过去吃）；
  // (b) 玩家「拖拽黑洞压到」这张卡（移动黑洞也能吃）。同一时刻只允许吃一张
  // （anyCapturing 守卫），兼顾「拖拽可吃」与「不一次吞一串 / 不被动漂移误吞」。
  // d 用硬约束后的真实位置重算，避免边界处误判。
  d=Math.hypot(S.bh.x-p.x, S.bh.y-p.y);
  if(S.bh && inS>0.9 && (S.bh.tgt===p || S.bh.drag) && !anyCapturing()
     && d < S.bh.r*0.78 + p.r*0.32){
    p.st='capturing'; p.cap=0;
    p.cr0=Math.max(d, p.r*0.5); p.ca0=Math.atan2(p.y-S.bh.y, p.x-S.bh.x);
    S.bh.tgt=null;
  }
}

function drawToneBall(g,p,dt){ // 声调球：固定位置，不漂移
  if(p.respawn>0){
    p.respawn-=dt;
    if(p.respawn<=0){ p.st='alive'; p.cap=0; }
    return;
  }
  var b=S.bh, isTarget=(b&&b.tgt===p);
  var needGlow=false;
  if(S.level && S.level.type==='spell' && S.hintOn && diffOn().hint){
    var t=S.level.tasks[S.ti];
    if(t && S.step===2 && p.tone===t.t) needGlow=true;
  }
  p.glow += ((needGlow||isTarget?1:0)-p.glow)*Math.min(1,dt*8);
  if(p.err>0) p.err=Math.max(0, p.err-dt*1.6);
  var sh = p.err>0 ? Math.sin(performance.now()/26)*p.err*6 : 0;
  var r=p.r*(1+Math.sin(performance.now()/300)*0.03+p.glow*0.09);
  g.save(); g.translate(p.x+sh,p.y);
  if(p.glow>0.02){
    g.globalAlpha=0.25+p.glow*0.5;
    var hg=g.createRadialGradient(0,0,r*0.6,0,0,r*2.1);
    hg.addColorStop(0,'#ffd98a'); hg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=hg; g.beginPath(); g.arc(0,0,r*2.1,0,6.283); g.fill();
    g.globalAlpha=1;
  }
  var gr=g.createRadialGradient(-r*0.32,-r*0.36,r*0.12,0,0,r);
  gr.addColorStop(0,'#ffd98a'); gr.addColorStop(1,'#e09b2d');
  g.fillStyle=gr; g.beginPath(); g.arc(0,0,r,0,6.283); g.fill();
  g.lineWidth=2; g.strokeStyle='rgba(255,255,255,'+(0.3+p.glow*0.5)+')';
  g.beginPath(); g.arc(0,0,r,0,6.283); g.stroke();
  if(p.err>0){
    g.lineWidth=3+3*p.err; g.strokeStyle='rgba(255,90,60,'+(0.85*p.err)+')';
    g.beginPath(); g.arc(0,0,r+4,0,6.283); g.stroke();
  }
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#3a2600';
  g.font='700 '+(r*1.0)+'px "Segoe UI",Arial,sans-serif';
  g.fillText(p.mark, 0, -r*0.12);
  g.font='600 '+(r*0.32)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText(p.name, 0, r*0.52);
  g.restore();
  // 声调球同样支持「拖拽黑洞压到即吃」，且同一时刻只吃一个（anyCapturing 守卫）
  if(b){
    var d=Math.hypot(b.x-p.x, b.y-p.y);
    if((isTarget || b.drag) && !anyCapturing() && d < b.r*0.78 + p.r*0.32){
      p.st='capturing'; p.cap=0;
      p.cr0=Math.max(d,p.r*0.5); p.ca0=Math.atan2(p.y-b.y, p.x-b.x);
      b.tgt=null;
    }
  }
}

function drawCapture(g,p,dt,b){
  p.cap += dt*1.7;
  var t=Math.min(1,p.cap);
  var rr=p.cr0*Math.pow(1-t,1.5);
  var ang=p.ca0 + t*6.0;
  var x=b.x+Math.cos(ang)*rr, y=b.y+Math.sin(ang)*rr;
  var s=Math.max(0.06,1-t*0.85);
  var stretch=1+t*1.6;
  g.save(); g.translate(x,y); g.rotate(ang+Math.PI/2); g.scale(s*stretch, s);
  var col = p.kind==='sm' ? '#7fb0ff' : (p.kind==='ym' ? '#6ce3bb' : '#ffd98a');
  g.globalAlpha=Math.max(0,1-t*0.7);
  g.textAlign='center'; g.textBaseline='middle';
  if(p.kind==='zi'){
    // 识字卡：吸入过程保留真实外形 + 汉字（原先退化成一个纯色圆，形状和汉字会凭空消失）
    var hr=shapeBound(p.shape, p.r), kz=shapeTextScale(p.shape);
    shapePath(g, p.shape, hr);
    var gr=g.createRadialGradient(-hr*0.32,-hr*0.36,hr*0.12,0,0,hr*1.05);
    gr.addColorStop(0,p.c1); gr.addColorStop(1,p.c2);
    g.fillStyle=gr; g.fill();
    g.lineWidth=2; g.strokeStyle='rgba(255,255,255,.5)'; g.stroke();
    if(t<0.55 && p.zi){
      g.font='800 '+(p.r*0.78*kz)+'px "PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
      g.lineWidth=Math.max(2,p.r*0.1); g.strokeStyle='rgba(255,255,255,.85)';
      g.strokeText(p.zi, 0, -p.r*kz*0.02);
      g.fillStyle='#231056'; g.fillText(p.zi, 0, -p.r*kz*0.02);
    }
  }else{
    g.fillStyle=col; g.beginPath(); g.arc(0,0,p.r,0,6.283); g.fill();
    if(t<0.5){
      g.fillStyle='#0c1330';
      var fs=p.r*0.7;
      g.font='800 '+fs+'px "Segoe UI",Arial,sans-serif';
      g.fillText(p.kind==='tone'?p.mark:p.py, 0, 0);
    }
  }
  g.restore(); g.globalAlpha=1;
  if(p.cap>=1){
    // 认读关（自由拼读 / 识字）：吃掉就永久消失 → 卡片「越吃越少」
    // 拼读关：同一张卡要重复用（找声母、找韵母、选声调），所以吃完重生
    if(S.level.type==='free' || S.level.type==='zi'){ p.st='gone'; }
    else { p.st='alive'; p.respawn = (p.kind==='tone')? 0.6 : 1.2; }
    onEaten(p);
  }
}

function drawBH(g,b,dt,demo){
  b.disk += dt*1.5;
  // 目标靠近
  if(!demo){
    if(b.tgt && b.tgt.st==='alive'){ b.tx=b.tgt.x; b.ty=b.tgt.y; }
    var k=1-Math.pow(diffOn().spd,dt);   // 难度档决定黑洞追星的-speed
    b.x += (b.tx-b.x)*k; b.y += (b.ty-b.y)*k;
  }
  // 黑洞必须留在可视场地内：否则拖到顶栏/底部卡后面就「找不到了」，
  // 横竖屏切换后旧坐标也会跑到屏外，导致卡死（修复旋转后吃不到）。
  var br2=b.r*0.2;
  b.x=Math.max(ARENA.x0+br2, Math.min(ARENA.x1-br2, b.x));
  b.y=Math.max(ARENA.y0+br2, Math.min(ARENA.y1-br2, b.y));
  // 成长：rBase 是开局基准半径，growT 记录「吃了几口」，r 平滑逼近目标半径
  if(b.rBase===undefined) b.rBase=b.r;
  if(b.growT===undefined) b.growT=0;
  if(b.flash===undefined) b.flash=0;
  var wantR = b.rBase*(1+Math.min(0.62, b.growT));
  b.r += (wantR-b.r)*Math.min(1, dt*3.2);
  if(b.flash>0) b.flash=Math.max(0, b.flash-dt*2.4);
  var R=b.r*(1+ (b.burst>0? b.burst*0.5:0));
  if(b.burst>0) b.burst=Math.max(0,b.burst-dt*1.2);
  // 长大越多内核越「沉」（由纯黑渐变到深紫黑），被吃的一瞬间闪一下
  var gv=Math.min(1, b.growT/0.62);
  var fl=b.flash;
  g.save(); g.translate(b.x,b.y);
  // 外层引力光晕（成长后更亮更暖）
  var hg=g.createRadialGradient(0,0,R*0.8,0,0,R*4.2);
  hg.addColorStop(0,'rgba(255,150,60,'+(0.30+gv*0.14+fl*0.20)+')');
  hg.addColorStop(0.35,'rgba(160,90,255,'+(0.14+gv*0.10+fl*0.16)+')');
  hg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=hg; g.beginPath(); g.arc(0,0,R*4.2,0,6.283); g.fill();
  // 吸积盘（旋转椭圆环）
  g.save(); g.rotate(b.disk*0.5);
  for(var i=0;i<3;i++){
    g.save(); g.scale(1,0.30); g.rotate(b.disk*(1+i*0.35));
    var rr=R*(1.5+i*0.42);
    var lg=g.createLinearGradient(-rr,0,rr,0);
    lg.addColorStop(0,'rgba(255,80,40,0)');
    lg.addColorStop(0.25,'rgba(255,170,70,'+(0.75-i*0.16+fl*0.2)+')');
    lg.addColorStop(0.5,'rgba(255,240,200,'+(0.85-i*0.18+fl*0.2)+')');
    lg.addColorStop(0.75,'rgba(255,120,50,'+(0.7-i*0.16+fl*0.2)+')');
    lg.addColorStop(1,'rgba(255,80,40,0)');
    g.strokeStyle=lg; g.lineWidth=R*0.20;
    g.beginPath(); g.arc(0,0,rr,0,6.283); g.stroke();
    g.restore();
  }
  g.restore();
  // 事件视界：内核色随成长加深（黑 → 深紫黑）
  var cg=g.createRadialGradient(0,0,R*0.05,0,0,R);
  cg.addColorStop(0,'rgba('+Math.round(6+gv*10)+','+Math.round(2)+','+Math.round(12+gv*46)+',1)');
  cg.addColorStop(0.72,'rgba(0,0,0,1)');
  cg.addColorStop(1,'rgba(0,0,0,1)');
  g.fillStyle=cg; g.beginPath(); g.arc(0,0,R,0,6.283); g.fill();
  // 内核边缘环：被吃后闪亮一圈（外扩淡出的反馈环）
  if(fl>0){
    g.strokeStyle='rgba(255,236,190,'+(fl*0.95)+')';
    g.lineWidth=2+fl*7;
    g.beginPath(); g.arc(0,0,R*(1+(1-fl)*0.22),0,6.283); g.stroke();
  }
  // 视界描边：成长后更亮更粗
  g.strokeStyle='rgba(255,'+Math.round(215+gv*30)+','+Math.round(150+gv*60)+','+(0.9+gv*0.1)+')';
  g.lineWidth=2.4+gv*1.8+fl*2.6;
  g.shadowColor='rgba(255,190,110,'+(0.35+gv*0.4+fl*0.5)+')'; g.shadowBlur=6+gv*10+fl*26;
  g.beginPath(); g.arc(0,0,R,0,6.283); g.stroke();
  g.shadowBlur=0;
  // 内核里的小高光点：数量随成长增加，暗示「吃得越多越强」
  var dots=Math.round(gv*4);
  for(var q=0;q<dots;q++){
    var an=b.disk*(0.7+q*0.5), dr=R*(0.34+0.10*(q%2));
    g.fillStyle='rgba(255,'+(190+q*12)+',110,'+(0.30+gv*0.25)+')';
    g.beginPath(); g.arc(Math.cos(an)*dr, Math.sin(an)*dr, R*(0.055+0.02*gv),0,6.283); g.fill();
  }
  // 中心标签（已拼出的音）
  if(b.labelT>0 && b.label){
    b.labelT-=dt;
    g.textAlign='center'; g.textBaseline='middle';
    g.fillStyle='#fff';
    var fs=Math.min(R*0.62, 34);
    g.font='800 '+fs+'px "Segoe UI",Arial,sans-serif';
    g.shadowColor='#ffb347'; g.shadowBlur=18;
    g.fillText(b.label,0,0);
    g.shadowBlur=0;
  }
  g.restore();
}

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}

/* ---------- 12a. 家长/老师「我的字表」自定义字库（v8 新增） ----------
   用途：把孩子的假期作业 / 自定义词语表粘贴进来，自动生成专属识字关。
   思路：解析出汉字 + 拼音（系统先从内置 300 字表查拼音，查不到的让用户手写「字 拼音」），
   把每 10 个字打包成一个 type:'zi' 的临时关（tmp:true，不与正式 49 关的通关记录混淆），
   并给每个自定义字补一个 PIN 条目（mkPlanet 才能正确显示拼音与配色）。
   发音：自定义字不在本地 303 条 mp3 包里，会回退到浏览器 TTS；PC/手机浏览器正常，
        微信里若该字也属内置字表则用本地音频，否则依赖系统朗读（已尽力兜底）。 */
function loadCustom(){
  try{ CUSTOM = JSON.parse(localStorage.getItem('bhpy_custom')||'[]'); }catch(e){ CUSTOM=[]; }
  if(!Array.isArray(CUSTOM)) CUSTOM=[];
  ensureCustomPin();
}
function ensureCustomPin(){
  CUSTOM.forEach(function(c){
    if(!PIN[c.zi]){
      PIN[c.zi] = {py:c.py||c.zi, zi:c.zi, say:c.zi, em:'', kind:'zi',
        shape:(ZI_SHAPE_FIX[c.zi]||'circle'), ci:(hzHash(c.zi)>>>5)%ZI_COLORS.length};
    }
  });
}
function buildZiPyMap(){ var m={}; ZI.forEach(function(z){ m[z[0]]=z[1]; }); return m; }
function buildCustomLevels(){
  var out=[];
  for(var i=0;i<CUSTOM.length;i+=10){
    var set=CUSTOM.slice(i,i+10).map(function(c){ return c.zi; });
    out.push({name:'我的字表 · 第'+(Math.floor(i/10)+1)+'组', type:'zi', set:set,
      diff:1, cust:true, tmp:true, custDone:set.every(function(z){ return S.prog.known[z]; }),
      tip:'这是你自己导入的字，认完这 '+set.length+' 个字！认一个少一个。'});
  }
  return out;
}

function doImport(){
  var ta=document.getElementById('importArea'); if(!ta) return;
  var text=ta.value||'';
  var ziPy={};
  // 逐行解析：每行拆成「汉字部分」+「拼音部分」。若拼音音节数与汉字数一致才按位配对，
  // 否则（如「苹果 píngguǒ」一词一字多音无法安全拆分）整行拼音作废，改由内置字库查拼音，
  // 避免把整词拼音错配到某个单字上。
  text.split(/[\n;；]+/).forEach(function(line){
    line=line.trim(); if(!line) return;
    var li=line.search(/[a-zA-Z]/);
    var han=(li<0?line:line.slice(0,li)).replace(/[^\u4e00-\u9fa5]/g,'');
    var py=li<0?'':line.slice(li);
    var chArr=han.split('');
    var pyArr=py.split(/[^a-zA-ZüÜǖǘǚǜēéěèōóǒòāáǎàīíǐìūúǔù]+/).filter(Boolean);
    if(chArr.length && pyArr.length===chArr.length){
      chArr.forEach(function(c,i){ ziPy[c]={zi:c, py:pyArr[i]}; });
    }
  });
  // 抽取全部汉字（去重，保持顺序）
  var chars=[]; text.replace(/[^\u4e00-\u9fa5]/g,'').split('').forEach(function(c){ if(chars.indexOf(c)<0) chars.push(c); });
  var zimap=buildZiPyMap(), entries=[], skipped=[];
  chars.forEach(function(c){
    if(ziPy[c]) entries.push(ziPy[c]);
    else if(zimap[c]) entries.push({zi:c, py:zimap[c]});
    else skipped.push(c);
  });
  var box=document.getElementById('importMsg');
  if(!entries.length){ if(box) box.textContent='没识别到汉字，请检查输入格式。'; return; }
  CUSTOM=entries; ensureCustomPin(); warmCustomAudio(entries.map(function(e){ return e.zi; }));
  try{ localStorage.setItem('bhpy_custom', JSON.stringify(CUSTOM)); }catch(e){}
  var msg='已生成 '+Math.ceil(entries.length/10)+' 个专属关卡（共 '+entries.length+' 字）！去「关卡地图」底部查看。';
  msg+='\n🎧 已为这些字预热发音（联网即响；部分设备可离线）。';
  if(skipped.length) msg+='\n⚠️ 以下字没查到拼音已跳过：'+skipped.join(' ')+'（可写成「字 拼音」补上，如 鑫 xīn）';
  if(box) box.textContent=msg;
  toast('导入成功，去关卡地图看看吧', 3);
  setTimeout(function(){ openLevels(); }, 1300);
}

  var bw3=document.getElementById('btnMistake'); if(bw3) bw3.onclick=function(){ Sfx.click(); openMistakeBook(); };
  // 正式关卡地图（网格节点 + 解锁态 + 星级）
  var map=document.createElement('div'); map.className='lvmap'; sc.appendChild(map);
  LEVELS.forEach(function(L,i){
    var unlocked = i===0 || S.prog.passed[i-1];
    var node=document.createElement('div');
